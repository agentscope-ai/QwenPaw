# Include inside the HTTPS server block on Nginx 1.25.1 or later.
# Keep proxy_http_version 1.1 and proxy_buffering off for application SSE.
http2 on;
access_log /var/log/nginx/agent-timing.log weldon_timing;
add_header X-Request-ID $request_id always;

# Add proxy_set_header X-Request-ID $request_id to each proxy location too.
# A location defining add_header must repeat X-Request-ID to include it there.
