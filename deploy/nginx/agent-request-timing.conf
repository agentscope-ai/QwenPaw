# Include in the http context, before the HTTPS server configuration.
# Query strings, cookies and authorization headers are deliberately omitted.
log_format weldon_timing '$time_iso8601 rid=$request_id method=$request_method uri=$uri status=$status rt=$request_time urt=$upstream_response_time uct=$upstream_connect_time uht=$upstream_header_time proto=$server_protocol bytes=$body_bytes_sent';
