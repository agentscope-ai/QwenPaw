# AgentGateway RBAC 演示 — 阶段 B：网关策略降权（换岗后）
#
# employeeQwenpaw 的 JWT 仍含 roles: ["manager"]（Token 未收回、未重签），
# 但网关按 jwt.sub 强制只允许论坛读/发帖。
# managerQwenpaw 仍为完整管理员。
#
# 切换：.\demo-rbac\scripts\downgrade-employee.ps1
# 恢复：.\demo-rbac\scripts\restore-employee-admin.ps1

frontendPolicies:
  accessLog:
    add:
      audit_mcp_error: mcp.tool.error
      audit_mcp_tool: mcp.tool.name

binds:
  - port: 3000
    listeners:
      - routes:
          - policies:
              cors:
                allowOrigins: ["*"]
                allowHeaders: ["*"]
                exposeHeaders: ["Mcp-Session-Id"]

              jwtAuth:
                mode: optional
                issuer: agentgateway.dev
                audiences: [test.agentgateway.dev]
                jwks:
                  file: demo-rbac/jwt/pub-key

              mcpAuthorization:
                rules:
                  # 无 Token（游客）：仅论坛读
                  - '!has(jwt.sub) && mcp.tool.name == "list_posts"'

                  # 已降权员工 employeeQwenpaw：仅论坛读 + 发帖（忽略 JWT 中 manager 角色）
                  - 'jwt.sub == "employeeQwenpaw" && mcp.tool.name == "list_posts"'
                  - 'jwt.sub == "employeeQwenpaw" && mcp.tool.name == "create_post"'

                  # 在岗管理员 managerQwenpaw：全部工具
                  - 'jwt.sub == "managerQwenpaw" && mcp.tool.name == "list_posts"'
                  - 'jwt.sub == "managerQwenpaw" && mcp.tool.name == "create_post"'
                  - 'jwt.sub == "managerQwenpaw" && mcp.tool.name == "delete_post"'
                  - 'jwt.sub == "managerQwenpaw" && mcp.tool.name == "get_employee"'
                  - 'jwt.sub == "managerQwenpaw" && mcp.tool.name == "update_employee"'

            backends:
              - mcp:
                  targets:
                    - name: hr
                      mcp:
                        host: http://127.0.0.1:9001/mcp
                    - name: forum
                      mcp:
                        host: http://127.0.0.1:9002/mcp
