<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>方案 A · 渐进式单面板</title>
    <link rel="stylesheet" href="./shared.css" />
  </head>
  <body>
    <main class="prototype">
      <header class="context-bar">
        <div class="context-title">
          <span>你的 proj_dir</span>
          <span class="muted">Qwen3.7 Max</span>
        </div>
        <nav class="toolbar" aria-label="聊天工具栏">
          <button class="icon-button" title="新建聊天"><i data-lucide="message-square-plus"></i></button>
          <button class="icon-button is-active" title="打开工作区"><i data-lucide="files"></i></button>
          <button class="icon-button" title="历史记录"><i data-lucide="history"></i></button>
          <button class="icon-button" title="全屏"><i data-lucide="expand"></i></button>
        </nav>
      </header>

      <section class="stage">
        <article class="dialog">
          <header class="dialog-header">
            <div class="title-group">
              <span class="title-icon"><i data-lucide="folder-cog"></i></span>
              <div>
                <p class="eyebrow">当前会话</p>
                <h1>项目目录</h1>
              </div>
            </div>
            <button class="close-button" aria-label="关闭"><i data-lucide="x"></i></button>
          </header>

          <div class="path-field">
            <i data-lucide="folder"></i>
            <input
              class="path-input"
              data-path-input
              value="/Users/raykkk/.copaw/workspaces/default/coding_projects/agentscope"
              aria-label="当前选择路径"
            />
            <span class="path-state">已选择</span>
          </div>

          <div class="dialog-body">
            <section class="recents">
              <div class="section-heading">
                <h2>最近项目</h2>
                <span>最近使用</span>
              </div>
              <div class="project-list">
                <button
                  class="project-row is-selected"
                  data-project="agentscope"
                  data-path="/Users/raykkk/.copaw/workspaces/default/coding_projects/agentscope"
                >
                  <span class="folder-icon"><i data-lucide="folder"></i></span>
                  <span class="project-copy">
                    <span class="project-name">agentscope</span>
                    <span class="project-path">…/coding_projects/agentscope</span>
                  </span>
                  <span class="selection-dot"><i data-lucide="check"></i></span>
                </button>
                <button
                  class="project-row"
                  data-project="agentscope-runtime"
                  data-path="/Users/raykkk/.copaw/workspaces/default/coding_projects/agentscope-runtime"
                >
                  <span class="folder-icon"><i data-lucide="folder"></i></span>
                  <span class="project-copy">
                    <span class="project-name">agentscope-runtime</span>
                    <span class="project-path">…/coding_projects/agentscope-runtime</span>
                  </span>
                  <span class="selection-dot"><i data-lucide="check"></i></span>
                </button>
                <button
                  class="project-row"
                  data-project="open_alias"
                  data-path="/Users/raykkk/.copaw/workspaces/default/coding_projects/open_alias"
                >
                  <span class="folder-icon"><i data-lucide="folder"></i></span>
                  <span class="project-copy">
                    <span class="project-name">open_alias</span>
                    <span class="project-path">…/coding_projects/open_alias</span>
                  </span>
                  <span class="selection-dot"><i data-lucide="check"></i></span>
                </button>
              </div>
            </section>

            <section class="browser">
              <div class="section-heading">
                <h2>浏览目录</h2>
                <button class="button ghost" data-show-recents>
                  <i data-lucide="arrow-left"></i>最近项目
                </button>
              </div>
              <nav class="breadcrumbs" aria-label="目录路径">
                <span class="breadcrumb">workspaces <i data-lucide="chevron-right"></i></span>
                <span class="breadcrumb">default <i data-lucide="chevron-right"></i></span>
                <span class="breadcrumb">coding_projects</span>
              </nav>
              <div class="folder-grid">
                <button class="folder-tile" data-folder="/Users/raykkk/.copaw/workspaces/default/coding_projects/CoPaw" data-name="CoPaw">
                  <i data-lucide="folder"></i><span>CoPaw</span>
                </button>
                <button class="folder-tile" data-folder="/Users/raykkk/.copaw/workspaces/default/coding_projects/demos" data-name="demos">
                  <i data-lucide="folder"></i><span>demos</span>
                </button>
                <button class="folder-tile" data-folder="/Users/raykkk/.copaw/workspaces/default/coding_projects/evals" data-name="evals">
                  <i data-lucide="folder"></i><span>evals</span>
                </button>
                <button class="folder-tile" data-folder="/Users/raykkk/.copaw/workspaces/default/coding_projects/qwen-agent" data-name="qwen-agent">
                  <i data-lucide="folder"></i><span>qwen-agent</span>
                </button>
              </div>
            </section>
          </div>

          <footer class="dialog-footer">
            <div class="footer-group">
              <button class="button" data-open-browser><i data-lucide="folder-open"></i>浏览目录</button>
              <button class="button ghost"><i data-lucide="rotate-ccw"></i>使用 Agent 默认目录</button>
            </div>
            <button class="button primary" data-apply>应用</button>
          </footer>
        </article>
      </section>
    </main>
    <script src="https://unpkg.com/lucide@0.562.0/dist/umd/lucide.min.js"></script>
    <script src="./prototype.js"></script>
  </body>
</html>
