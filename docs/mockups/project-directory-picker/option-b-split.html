<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>方案 B · 双栏专业选择器</title>
    <link rel="stylesheet" href="./shared.css" />
  </head>
  <body>
    <main class="prototype">
      <header class="context-bar">
        <div class="context-title">
          <span>你的 proj_dir</span>
          <span class="muted">Qwen3.7 Max</span>
        </div>
        <nav class="toolbar" aria-label="聊天工具栏">
          <button class="icon-button" title="新建聊天"><i data-lucide="message-square-plus"></i></button>
          <button class="icon-button is-active" title="打开工作区"><i data-lucide="files"></i></button>
          <button class="icon-button" title="历史记录"><i data-lucide="history"></i></button>
          <button class="icon-button" title="全屏"><i data-lucide="expand"></i></button>
        </nav>
      </header>

      <section class="stage">
        <article class="dialog split-dialog">
          <header class="dialog-header">
            <div class="title-group">
              <span class="title-icon"><i data-lucide="folders"></i></span>
              <div>
                <p class="eyebrow">当前会话</p>
                <h1>选择项目目录</h1>
              </div>
            </div>
            <button class="close-button" aria-label="关闭"><i data-lucide="x"></i></button>
          </header>

          <div class="path-field" style="margin-bottom: 18px">
            <i data-lucide="folder"></i>
            <input
              class="path-input"
              data-path-input
              value="/Users/raykkk/.copaw/workspaces/default/coding_projects/agentscope"
              aria-label="当前选择路径"
            />
            <span class="path-state">已选择</span>
          </div>

          <div class="split-body">
            <section class="split-pane">
              <div class="section-heading">
                <h2>最近项目</h2>
                <span>4</span>
              </div>
              <div class="project-list">
                <button
                  class="project-row is-selected"
                  data-project="agentscope"
                  data-path="/Users/raykkk/.copaw/workspaces/default/coding_projects/agentscope"
                >
                  <span class="folder-icon"><i data-lucide="folder"></i></span>
                  <span class="project-copy">
                    <span class="project-name">agentscope</span>
                    <span class="project-path">…/coding_projects/agentscope</span>
                  </span>
                  <span class="selection-dot"><i data-lucide="check"></i></span>
                </button>
                <button
                  class="project-row"
                  data-project="agentscope-runtime"
                  data-path="/Users/raykkk/.copaw/workspaces/default/coding_projects/agentscope-runtime"
                >
                  <span class="folder-icon"><i data-lucide="folder"></i></span>
                  <span class="project-copy">
                    <span class="project-name">agentscope-runtime</span>
                    <span class="project-path">…/agentscope-runtime</span>
                  </span>
                  <span class="selection-dot"><i data-lucide="check"></i></span>
                </button>
                <button
                  class="project-row"
                  data-project="open_alias"
                  data-path="/Users/raykkk/.copaw/workspaces/default/coding_projects/open_alias"
                >
                  <span class="folder-icon"><i data-lucide="folder"></i></span>
                  <span class="project-copy">
                    <span class="project-name">open_alias</span>
                    <span class="project-path">…/coding_projects/open_alias</span>
                  </span>
                  <span class="selection-dot"><i data-lucide="check"></i></span>
                </button>
                <button
                  class="project-row"
                  data-project="rayrayraykk"
                  data-path="/Users/raykkk/.copaw/workspaces/default/coding_projects/rayrayraykk"
                >
                  <span class="folder-icon"><i data-lucide="folder"></i></span>
                  <span class="project-copy">
                    <span class="project-name">rayrayraykk</span>
                    <span class="project-path">…/coding_projects/rayrayraykk</span>
                  </span>
                  <span class="selection-dot"><i data-lucide="check"></i></span>
                </button>
              </div>
            </section>

            <section class="split-pane">
              <div class="explorer-toolbar">
                <div>
                  <p class="eyebrow">浏览目录</p>
                  <p class="explorer-path">…/workspaces/default/coding_projects</p>
                </div>
                <div class="toolbar">
                  <button class="icon-button" title="上一级"><i data-lucide="corner-left-up"></i></button>
                  <button class="icon-button" title="新建文件夹"><i data-lucide="folder-plus"></i></button>
                </div>
              </div>
              <div class="explorer-list">
                <button class="explorer-row" data-folder="/Users/raykkk/.copaw/workspaces/default/coding_projects/CoPaw" data-name="CoPaw">
                  <i data-lucide="folder"></i><span class="row-name">CoPaw</span><span class="row-meta">今天</span>
                </button>
                <button class="explorer-row" data-folder="/Users/raykkk/.copaw/workspaces/default/coding_projects/demos" data-name="demos">
                  <i data-lucide="folder"></i><span class="row-name">demos</span><span class="row-meta">昨天</span>
                </button>
                <button class="explorer-row" data-folder="/Users/raykkk/.copaw/workspaces/default/coding_projects/evals" data-name="evals">
                  <i data-lucide="folder"></i><span class="row-name">evals</span><span class="row-meta">7月22日</span>
                </button>
                <button class="explorer-row" data-folder="/Users/raykkk/.copaw/workspaces/default/coding_projects/qwen-agent" data-name="qwen-agent">
                  <i data-lucide="folder"></i><span class="row-name">qwen-agent</span><span class="row-meta">7月18日</span>
                </button>
                <button class="explorer-row" data-folder="/Users/raykkk/.copaw/workspaces/default/coding_projects/sandbox" data-name="sandbox">
                  <i data-lucide="folder"></i><span class="row-name">sandbox</span><span class="row-meta">7月11日</span>
                </button>
              </div>
            </section>
          </div>

          <footer class="dialog-footer">
            <button class="button ghost"><i data-lucide="rotate-ccw"></i>使用 Agent 默认目录</button>
            <div class="footer-group">
              <span class="compact-status"><i data-lucide="circle-check"></i><span data-selected-name>agentscope</span></span>
              <button class="button primary" data-apply>应用</button>
            </div>
          </footer>
        </article>
      </section>
    </main>
    <script src="https://unpkg.com/lucide@0.562.0/dist/umd/lucide.min.js"></script>
    <script src="./prototype.js"></script>
  </body>
</html>
