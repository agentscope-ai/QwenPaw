schema_version: 1
captured_on: 2026-08-20

# 共享字段只用于减少重复；YAML 合并后，每条失败仍包含完整的分类信息。
x-windows-symlink: &windows-symlink
  kind: failure
  error_type: ""
  summary_pattern: "WinError 1314"
  blocks_multi_user: false
  rationale: Windows 当前进程没有创建符号链接所需权限。

x-memory-edges: &memory-edges
  kind: failure
  error_type: ""
  summary_pattern: "KeyError: 'edges'"
  blocks_multi_user: true
  rationale: 记忆重排测试夹具与当前响应结构不一致，属于记忆核心链路风险。

x-mattermost-cert: &mattermost-cert
  kind: error
  error_type: ""
  summary_pattern: "NO_CERTIFICATE_OR_CRL_FOUND"
  blocks_multi_user: false
  rationale: 前序证书环境测试遗留 SSL_CERT_FILE，导致同一进程内的 Mattermost fixture 级联失败。

x-playwright-browser: &playwright-browser
  kind: failure
  error_type: ""
  summary_pattern: "Executable doesn't exist at .*ms-playwright"
  blocks_multi_user: false
  rationale: 本机缺少当前 Playwright 版本对应的 Chromium 可执行文件。

x-cloudpaw-install: &cloudpaw-install
  kind: failure
  error_type: ""
  summary_pattern: "Dependency installation failed for 'cloudpaw'"
  blocks_multi_user: false
  rationale: 隔离集成环境中的官方插件依赖安装进程返回失败，未进入插件功能断言。

