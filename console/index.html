<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/online.svg" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <title>QwenPaw Console</title>
    <style>
      .qwenpaw-boot {
        align-items: center;
        background: #f7f7f5;
        color: #1f1f1f;
        display: flex;
        font-family:
          Inter,
          ui-sans-serif,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;
        inset: 0;
        justify-content: center;
        position: fixed;
      }
      .qwenpaw-boot__content {
        align-items: center;
        display: flex;
        flex-direction: column;
        gap: 18px;
      }
      .qwenpaw-boot__logo {
        height: 68px;
        object-fit: contain;
        width: 68px;
      }
      .qwenpaw-boot__label {
        color: #70706c;
        font-size: 13px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }
      .qwenpaw-boot__error {
        align-items: center;
        display: flex;
        flex-direction: column;
        gap: 8px;
        text-align: center;
      }
      .qwenpaw-boot__error-title {
        color: #1f1f1f;
        font-size: 15px;
        font-weight: 600;
      }
      .qwenpaw-boot__error-detail {
        color: #70706c;
        font-size: 12px;
        max-width: 320px;
        overflow-wrap: anywhere;
      }
      .qwenpaw-boot__reload {
        background: #1f1f1f;
        border: none;
        border-radius: 6px;
        color: #f7f7f5;
        cursor: pointer;
        font-size: 13px;
        margin-top: 6px;
        padding: 8px 18px;
      }
      @media (prefers-color-scheme: dark) {
        .qwenpaw-boot {
          background: #141414;
          color: #f4f4f1;
        }
        .qwenpaw-boot__label {
          color: #a6a6a0;
        }
        .qwenpaw-boot__error-title {
          color: #f4f4f1;
        }
        .qwenpaw-boot__error-detail {
          color: #a6a6a0;
        }
        .qwenpaw-boot__reload {
          background: #f4f4f1;
          color: #141414;
        }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="qwenpaw-boot" role="status" aria-live="polite">
        <div class="qwenpaw-boot__content">
          <img class="qwenpaw-boot__logo" src="/qwenpaw.png" alt="QwenPaw" />
          <span class="qwenpaw-boot__label">Loading Console</span>
        </div>
      </div>
    </div>
    <script src="/bootWatchdog.js"></script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
