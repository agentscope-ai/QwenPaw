<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    width: 300px; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: #0f172a; color: #e2e8f0; padding: 16px;
  }
  h1 { font-size: 15px; font-weight: 600; margin-bottom: 12px; display: flex; align-items: center; gap: 8px; }
  .logo { width: 20px; height: 20px; border-radius: 4px; background: linear-gradient(135deg, #3b82f6, #6366f1); }
  .section { margin-bottom: 14px; }
  label { display: block; font-size: 11px; color: #94a3b8; margin-bottom: 4px; text-transform: uppercase; letter-spacing: 0.5px; }
  input {
    width: 100%; padding: 7px 10px; border: 1px solid #334155; border-radius: 6px;
    background: #1e293b; color: #e2e8f0; font-size: 13px; outline: none;
  }
  input:focus { border-color: #3b82f6; }
  .row { display: flex; gap: 8px; }
  .row > .field { flex: 1; }
  .row > .field.port { max-width: 80px; }
  .status-bar {
    display: flex; align-items: center; gap: 8px; padding: 8px 10px;
    background: #1e293b; border-radius: 6px; margin-bottom: 14px;
  }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: #ef4444; }
  .dot.on { background: #22c55e; }
  .status-text { font-size: 12px; flex: 1; }
  button {
    width: 100%; padding: 8px; border: none; border-radius: 6px;
    font-size: 13px; font-weight: 500; cursor: pointer; transition: background 0.15s;
  }
  .btn-primary { background: #3b82f6; color: #fff; }
  .btn-primary:hover { background: #2563eb; }
  .btn-danger { background: #ef4444; color: #fff; margin-top: 6px; }
  .btn-danger:hover { background: #dc2626; }
  .tabs-list { margin-top: 8px; font-size: 12px; color: #94a3b8; }
  .tabs-list .tab-item { padding: 4px 0; border-bottom: 1px solid #1e293b; }
</style>
</head>
<body>
  <h1><span class="logo"></span> QwenPaw Bridge</h1>

  <div class="status-bar">
    <span class="dot" id="dot"></span>
    <span class="status-text" id="status">Disconnected</span>
  </div>

  <div class="section">
    <div class="row">
      <div class="field">
        <label>Host</label>
        <input type="text" id="host" value="127.0.0.1" placeholder="127.0.0.1">
      </div>
      <div class="field port">
        <label>Port</label>
        <input type="text" id="port" value="8088" placeholder="8088">
      </div>
    </div>
  </div>

  <div class="section">
    <label>Workspace</label>
    <input type="text" id="workspace" value="default" placeholder="default">
  </div>

  <button class="btn-primary" id="connectBtn">Connect</button>
  <button class="btn-danger" id="disconnectBtn" style="display:none">Disconnect</button>

  <div class="section">
    <label>Managed Tabs</label>
    <div class="tabs-list" id="tabsList">None</div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
