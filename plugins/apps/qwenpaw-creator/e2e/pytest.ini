[pytest]
testpaths = tests
python_files = test_*.py
python_functions = test_*
addopts =
    -v
    --tb=short
    --strict-markers
markers =
    shell: Home、Composer、模型配置与项目生命周期
    timeline: Timeline/Element Plan 交互
    assets: Project Asset Index 与补充资料上传
filterwarnings =
    ignore::DeprecationWarning
