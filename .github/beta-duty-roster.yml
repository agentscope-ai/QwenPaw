# Beta Release 安装验证值班名单
#
# 每次 beta release 发布时，Action 根据 tag hash 从下面的列表中轮转分配值班人。
# 如需临时换班，在对应 GitHub Issue 里手动 re-assign 即可。
#
# 字段说明：
#   github  - GitHub 用户名（用于 @assign 和通知）
#   name    - 显示名称（用于日志输出）
#   platforms - 该成员负责验证的平台（可选，留空表示全平台）
#               可选值：pypi / docker / macos / windows

rotation:
  - github: placeholder-member-1
    name: Member 1
    platforms: []  # 空列表 = 全平台

  - github: placeholder-member-2
    name: Member 2
    platforms: []

  - github: placeholder-member-3
    name: Member 3
    platforms: []
