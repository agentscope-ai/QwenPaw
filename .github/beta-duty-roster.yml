# Beta Release Installation Duty Roster
#
# Each platform has its own independent rotation list of GitHub usernames.
# The Action picks the next person sequentially:
#   index = (number of previous pre-releases) % len(rotation)
# No state file needed — the count is derived from the GitHub Releases API.
#
# To temporarily swap, manually re-assign in the Duty Issue on GitHub.

pypi:
  rotation:
    - placeholder-pypi-1
    - placeholder-pypi-2

docker:
  rotation:
    - placeholder-docker-1
    - placeholder-docker-2

macos:
  rotation:
    - placeholder-macos-1
    - placeholder-macos-2

windows:
  rotation:
    - placeholder-windows-1
    - placeholder-windows-2
