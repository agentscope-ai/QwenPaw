self-hosted-runner:
  labels: []
config-variables:
  - tauri_updater_pubkey
  - tauri_updater_endpoints
  - oss_bucket
  - oss_public_base_url
  - review_model
  - model_canary_enabled
paths:
  # GitHub supports concurrency.queue; the pinned actionlint does not.
  # Remove this narrow exception once the linter supports the field.
  .github/workflows/{plugin-release-guard,release,plugins-release,creator-release,qwenpaw-data-release,channel-release}.yml:
    ignore:
      - '^unexpected key "queue" for "concurrency" section\.'
  # Legacy build-windows / build-macos jobs are intentionally parked with
  # `if: ${{ false }}` after the switch to Tauri (#5734). The packaging
  # code is kept in place but not run, so ignore the constant-condition hint.
  .github/workflows/desktop-release.yml:
    ignore:
      - 'constant expression "false" in condition. remove the if: section'
