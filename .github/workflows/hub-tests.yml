name: Hub Tests

on:
  pull_request:
    paths:
      - '.github/workflows/hub-tests.yml'
      - 'console/src/api/modules/hub.ts'
      - 'console/src/api/modules/hub.test.ts'
      - 'console/src/locales/hubLocales.test.ts'
      - 'console/src/pages/Hub/**'
      - 'console/src/pages/Login/**'
      - 'deploy/Dockerfile'
      - 'src/qwenpaw/app/auth.py'
      - 'src/qwenpaw/hub/**'
      - 'src/qwenpaw/utils/oauth_callback.py'
      - 'tests/e2e/test_windows_hub_local_runtime.py'
      - 'tests/unit/app/test_hub_runtime_boundary.py'
      - 'tests/unit/app/routers/test_mcp_oauth_callback.py'
      - 'tests/unit/app/routers/test_mcp_oauth_discovery.py'
      - 'tests/unit/app/routers/test_provider_oauth_router.py'
      - 'tests/unit/hub/**'
  workflow_dispatch:

jobs:
  backend:
    name: Hub Backend - ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[hub,dev,test,full]"

      - name: Run focused Hub tests
        shell: bash
        run: |
          pytest \
            tests/unit/hub \
            tests/unit/app/test_hub_runtime_boundary.py \
            tests/unit/app/routers/test_mcp_oauth_callback.py \
            tests/unit/app/routers/test_mcp_oauth_discovery.py \
            tests/unit/app/routers/test_provider_oauth_router.py \
            -v

  console:
    name: Hub Console
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: console/package-lock.json

      - name: Install dependencies
        working-directory: console
        run: npm ci

      - name: Run focused Hub console tests
        working-directory: console
        run: |
          npm run test:run -- \
            src/api/modules/hub.test.ts \
            src/locales/hubLocales.test.ts \
            src/pages/Hub/index.test.tsx \
            src/pages/Login/index.test.tsx

      - name: Build console
        working-directory: console
        env:
          NODE_OPTIONS: --max-old-space-size=8192
        run: npm run build

  windows-runtime:
    name: Windows Hub Runtime
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[hub,dev,test,full]"

      - name: Verify real AppContainer runtime
        shell: bash
        env:
          QWENPAW_WINDOWS_APPCONTAINER_E2E: '1'
        run: |
          pytest \
            tests/unit/hub/test_windows_process_isolation.py::test_windows_appcontainer_real_preflight \
            tests/e2e/test_windows_hub_local_runtime.py \
            -v
