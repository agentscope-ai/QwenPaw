name: One model benchmark suite
on:
  workflow_call:
    inputs:
      batches:
        required: true
        type: number
      experiment:
        required: true
        type: string
      model:
        required: true
        type: number
permissions:
  contents: read
jobs:
  stage:
    environment: Bench
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: bench-prepared
          path: prepared
      - name: Resolve and validate provider credential
        id: provider
        env:
          MANIFEST_PATH: prepared/${{ inputs.experiment }}/manifest.json
        run: |
          python - <<'PYCODE'
          import json, os
          from pathlib import Path
          data = json.loads(Path(os.environ['MANIFEST_PATH']).read_text())
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('secret_name=' + data['models']['provider']['secret_name'] + '\n')
          PYCODE
      - name: Require configured secret before scheduling tasks
        env:
          BENCH_API_KEY: ${{ secrets[steps.provider.outputs.secret_name] }}
        run: |
          if [ -z "$BENCH_API_KEY" ]; then
            echo '::error::The configured Bench provider secret is unavailable.'
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        id: upload_manifest
        continue-on-error: true
        with:
          name: bench-manifest-${{ inputs.experiment }}
          path: prepared/${{ inputs.experiment }}/manifest.json
          overwrite: true
          compression-level: 0
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: steps.upload_manifest.outcome == 'failure'
        with:
          name: bench-manifest-${{ inputs.experiment }}
          path: prepared/${{ inputs.experiment }}/manifest.json
          overwrite: true
          compression-level: 0
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        id: upload_0
        continue-on-error: true
        if: inputs.batches > 0
        with:
          name: bench-tasks-${{ inputs.experiment }}-0
          path: prepared/${{ inputs.experiment }}/batch-0.tar.gz
          overwrite: true
          compression-level: 0
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: steps.upload_0.outcome == 'failure'
        with:
          name: bench-tasks-${{ inputs.experiment }}-0
          path: prepared/${{ inputs.experiment }}/batch-0.tar.gz
          overwrite: true
          compression-level: 0
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        id: upload_1
        continue-on-error: true
        if: inputs.batches > 1
        with:
          name: bench-tasks-${{ inputs.experiment }}-1
          path: prepared/${{ inputs.experiment }}/batch-1.tar.gz
          overwrite: true
          compression-level: 0
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: steps.upload_1.outcome == 'failure'
        with:
          name: bench-tasks-${{ inputs.experiment }}-1
          path: prepared/${{ inputs.experiment }}/batch-1.tar.gz
          overwrite: true
          compression-level: 0
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        id: upload_2
        continue-on-error: true
        if: inputs.batches > 2
        with:
          name: bench-tasks-${{ inputs.experiment }}-2
          path: prepared/${{ inputs.experiment }}/batch-2.tar.gz
          overwrite: true
          compression-level: 0
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: steps.upload_2.outcome == 'failure'
        with:
          name: bench-tasks-${{ inputs.experiment }}-2
          path: prepared/${{ inputs.experiment }}/batch-2.tar.gz
          overwrite: true
          compression-level: 0
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        id: upload_3
        continue-on-error: true
        if: inputs.batches > 3
        with:
          name: bench-tasks-${{ inputs.experiment }}-3
          path: prepared/${{ inputs.experiment }}/batch-3.tar.gz
          overwrite: true
          compression-level: 0
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: steps.upload_3.outcome == 'failure'
