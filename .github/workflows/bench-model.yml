          path: prepared/${{ inputs.experiment }}/batch-7.tar.gz
          overwrite: true
          compression-level: 0
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        id: upload_8
        continue-on-error: true
        if: inputs.batches > 8
        with:
          name: bench-tasks-${{ inputs.experiment }}-8
          path: prepared/${{ inputs.experiment }}/batch-8.tar.gz
          overwrite: true
          compression-level: 0
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: steps.upload_8.outcome == 'failure'
        with:
          name: bench-tasks-${{ inputs.experiment }}-8
          path: prepared/${{ inputs.experiment }}/batch-8.tar.gz
          overwrite: true
          compression-level: 0
          if-no-files-found: error
  batch_0:
    needs: stage
    uses: ./.github/workflows/bench-batch.yml
    secrets: inherit
    with:
      experiment: ${{ inputs.experiment }}
      model: ${{ inputs.model }}
      batch: 0
  batch_1:
    needs: [stage, batch_0]
    if: ${{ always() && !cancelled() && needs.stage.result == 'success' && inputs.batches > 1 }}
    uses: ./.github/workflows/bench-batch.yml
    secrets: inherit
    with:
      experiment: ${{ inputs.experiment }}
      model: ${{ inputs.model }}
      batch: 1
  batch_2:
    needs: [stage, batch_1]
    if: ${{ always() && !cancelled() && needs.stage.result == 'success' && inputs.batches > 2 }}
