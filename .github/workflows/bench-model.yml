          path: prepared/${{ inputs.experiment }}/batch-3.tar.gz
          overwrite: true
          compression-level: 0
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        id: upload_4
        continue-on-error: true
        if: inputs.batches > 4
        with:
          name: bench-tasks-${{ inputs.experiment }}-4
          path: prepared/${{ inputs.experiment }}/batch-4.tar.gz
          overwrite: true
          compression-level: 0
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: steps.upload_4.outcome == 'failure'
        with:
