    if: ${{ always() && !cancelled() && needs.stage.result == 'success' && inputs.batches > 5 }}
    uses: ./.github/workflows/bench-batch.yml
    secrets: inherit
    with:
      experiment: ${{ inputs.experiment }}
      model: ${{ inputs.model }}
      batch: 5
  batch_6:
    needs: [stage, batch_5]
    if: ${{ always() && !cancelled() && needs.stage.result == 'success' && inputs.batches > 6 }}
    uses: ./.github/workflows/bench-batch.yml
    secrets: inherit
    with:
      experiment: ${{ inputs.experiment }}
