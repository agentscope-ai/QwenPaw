      - uses: actions/upload-artifact@v4
        id: upload_6
        continue-on-error: true
        if: inputs.batches > 6
        with:
          name: bench-tasks-${{ inputs.experiment }}-6
          path: prepared/${{ inputs.experiment }}/batch-6.tar.gz
          overwrite: true
          compression-level: 0
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: steps.upload_6.outcome == 'failure'
        with:
          name: bench-tasks-${{ inputs.experiment }}-6
          path: prepared/${{ inputs.experiment }}/batch-6.tar.gz
          overwrite: true
          compression-level: 0
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        id: upload_7
        continue-on-error: true
        if: inputs.batches > 7
        with:
          name: bench-tasks-${{ inputs.experiment }}-7
          path: prepared/${{ inputs.experiment }}/batch-7.tar.gz
          overwrite: true
          compression-level: 0
