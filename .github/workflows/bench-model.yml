name: One model benchmark suite
on:
  workflow_call:
    inputs:
      batches:
        required: true
        type: number
      experiment:
        required: true
        type: string
      model:
        required: true
        type: number
permissions:
  contents: read
jobs:
  stage:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: bench-prepared
          path: prepared
      - uses: actions/upload-artifact@v4
        with:
          name: bench-manifest-${{ inputs.experiment }}
          path: prepared/${{ inputs.experiment }}/manifest.json
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: inputs.batches > 0
        with:
          name: bench-tasks-${{ inputs.experiment }}-0
          path: prepared/${{ inputs.experiment }}/batch-0.tar.gz
          compression-level: 0
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: inputs.batches > 1
        with:
          name: bench-tasks-${{ inputs.experiment }}-1
          path: prepared/${{ inputs.experiment }}/batch-1.tar.gz
          compression-level: 0
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: inputs.batches > 2
        with:
          name: bench-tasks-${{ inputs.experiment }}-2
          path: prepared/${{ inputs.experiment }}/batch-2.tar.gz
          compression-level: 0
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: inputs.batches > 3
        with:
          name: bench-tasks-${{ inputs.experiment }}-3
          path: prepared/${{ inputs.experiment }}/batch-3.tar.gz
          compression-level: 0
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: inputs.batches > 4
        with:
          name: bench-tasks-${{ inputs.experiment }}-4
          path: prepared/${{ inputs.experiment }}/batch-4.tar.gz
          compression-level: 0
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: inputs.batches > 5
        with:
          name: bench-tasks-${{ inputs.experiment }}-5
          path: prepared/${{ inputs.experiment }}/batch-5.tar.gz
          compression-level: 0
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: inputs.batches > 6
        with:
          name: bench-tasks-${{ inputs.experiment }}-6
          path: prepared/${{ inputs.experiment }}/batch-6.tar.gz
          compression-level: 0
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: inputs.batches > 7
        with:
          name: bench-tasks-${{ inputs.experiment }}-7
          path: prepared/${{ inputs.experiment }}/batch-7.tar.gz
          compression-level: 0
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: inputs.batches > 8
        with:
          name: bench-tasks-${{ inputs.experiment }}-8
          path: prepared/${{ inputs.experiment }}/batch-8.tar.gz
          compression-level: 0
          if-no-files-found: error
  batch_0:
    needs: stage
    uses: ./.github/workflows/bench-batch.yml
    with:
      experiment: ${{ inputs.experiment }}
      model: ${{ inputs.model }}
      batch: 0
  batch_1:
    needs: [stage, batch_0]
    if: ${{ always() && !cancelled() && needs.stage.result == 'success' && inputs.batches > 1 }}
    uses: ./.github/workflows/bench-batch.yml
    with:
      experiment: ${{ inputs.experiment }}
      model: ${{ inputs.model }}
      batch: 1
  batch_2:
    needs: [stage, batch_1]
    if: ${{ always() && !cancelled() && needs.stage.result == 'success' && inputs.batches > 2 }}
    uses: ./.github/workflows/bench-batch.yml
    with:
      experiment: ${{ inputs.experiment }}
      model: ${{ inputs.model }}
      batch: 2
  batch_3:
    needs: [stage, batch_2]
    if: ${{ always() && !cancelled() && needs.stage.result == 'success' && inputs.batches > 3 }}
    uses: ./.github/workflows/bench-batch.yml
    with:
      experiment: ${{ inputs.experiment }}
      model: ${{ inputs.model }}
      batch: 3
  batch_4:
    needs: [stage, batch_3]
    if: ${{ always() && !cancelled() && needs.stage.result == 'success' && inputs.batches > 4 }}
    uses: ./.github/workflows/bench-batch.yml
    with:
      experiment: ${{ inputs.experiment }}
      model: ${{ inputs.model }}
      batch: 4
  batch_5:
    needs: [stage, batch_4]
    if: ${{ always() && !cancelled() && needs.stage.result == 'success' && inputs.batches > 5 }}
    uses: ./.github/workflows/bench-batch.yml
    with:
      experiment: ${{ inputs.experiment }}
      model: ${{ inputs.model }}
      batch: 5
  batch_6:
    needs: [stage, batch_5]
    if: ${{ always() && !cancelled() && needs.stage.result == 'success' && inputs.batches > 6 }}
    uses: ./.github/workflows/bench-batch.yml
    with:
      experiment: ${{ inputs.experiment }}
      model: ${{ inputs.model }}
      batch: 6
  batch_7:
    needs: [stage, batch_6]
    if: ${{ always() && !cancelled() && needs.stage.result == 'success' && inputs.batches > 7 }}
    uses: ./.github/workflows/bench-batch.yml
    with:
      experiment: ${{ inputs.experiment }}
      model: ${{ inputs.model }}
      batch: 7
  batch_8:
    needs: [stage, batch_7]
    if: ${{ always() && !cancelled() && needs.stage.result == 'success' && inputs.batches > 8 }}
    uses: ./.github/workflows/bench-batch.yml
    with:
      experiment: ${{ inputs.experiment }}
      model: ${{ inputs.model }}
      batch: 8
