name: Plugin Versions

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

jobs:
  check:
    name: Plugin Versions
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install release test dependencies
        run: python -m pip install packaging pytest
      - name: Test immutable release guard
        run: >-
          python -m pytest --noconftest -q
          tests/unit/plugins/test_generate_plugin_metadata.py
          -k 'release_content_digest or immutable_release'
