name: Benchmark ACP smoke
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  smoke:
    if: github.repository == 'rayrayraykk/CoPaw'
    environment: Bench
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.8.22'
          python-version: '3.12'
      - name: Unit tests
        run: |
          uv run --no-project --with harbor==0.24.0 --with litellm==1.103.4 --with pytest python -m pytest \
            -c /dev/null --confcutdir=tests/unit/scripts/bench \
            -p no:cacheprovider tests/unit/scripts/bench -q
      - name: Check model catalog without exposing credentials
        env:
          BENCH_API_KEY: ${{ secrets.DASHSCOPE_API_KEY }}
        run: uv run --no-project --with harbor==0.24.0 --with litellm==1.103.4 python -m scripts.bench.probe
      - name: Real Docker and QwenPaw ACP smoke
        env:
          BENCH_API_KEY: ${{ secrets.DASHSCOPE_API_KEY }}
          EVALUATION_SHA: ${{ github.sha }}
          SOURCE_REPOSITORY: ${{ github.repository }}
        run: |
          uv run --no-project --with harbor==0.24.0 --with litellm==1.103.4 python -m scripts.bench.smoke \
            --output "$RUNNER_TEMP/smoke" \
            --sha "$EVALUATION_SHA" --repository "$SOURCE_REPOSITORY"
      - name: Upload structured receipt only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bench-smoke-receipt
          path: ${{ runner.temp }}/smoke/result/receipt.json
          if-no-files-found: warn

  gaia:
    if: github.repository == 'rayrayraykk/CoPaw'
    environment: Bench
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.8.22'
          python-version: '3.12'
      - name: One native GAIA task with original grader and timeouts
        env:
          BENCH_API_KEY: ${{ secrets.DASHSCOPE_API_KEY }}
          EVALUATION_SHA: ${{ github.sha }}
          SOURCE_REPOSITORY: ${{ github.repository }}
        run: |
          uv run --no-project --with harbor==0.24.0 --with litellm==1.103.4 python -m scripts.bench.smoke \
            --gaia --output "$RUNNER_TEMP/gaia" \
            --sha "$EVALUATION_SHA" --repository "$SOURCE_REPOSITORY"
      - name: Upload native task receipt only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bench-gaia-receipt
          path: ${{ runner.temp }}/gaia/result/receipt.json
          if-no-files-found: warn
