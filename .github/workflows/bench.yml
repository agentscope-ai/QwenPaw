name: Release benchmarks
on:
  release:
    types: [published]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: release-benchmarks
  cancel-in-progress: false
jobs:
  prepare:
    # Enable after offline protocol, API and hosted-resource acceptance.
    if: github.event_name == 'workflow_dispatch' || vars.BENCH_ENABLED == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.8.22'
          python-version: '3.12'
      - name: Export and freeze native Harbor datasets
        env:
          EVALUATION_SHA: ${{ github.sha }}
          SOURCE_REPOSITORY: ${{ github.repository }}
        run: |
          uv run --no-project --with harbor==0.24.0 --with litellm==1.103.4 python -m scripts.bench.prepare \
            --download --output "$RUNNER_TEMP/bench" \
            --sha "$EVALUATION_SHA" --repository "$SOURCE_REPOSITORY"
      - uses: actions/upload-artifact@v4
        with:
          name: bench-manifest
          path: ${{ runner.temp }}/bench/manifest.json
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: bench-tasks-0
          path: ${{ runner.temp }}/bench/batch-0.tar.gz
          compression-level: 0
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: bench-tasks-1
          path: ${{ runner.temp }}/bench/batch-1.tar.gz
          compression-level: 0
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: bench-tasks-2
          path: ${{ runner.temp }}/bench/batch-2.tar.gz
          compression-level: 0
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: bench-tasks-3
          path: ${{ runner.temp }}/bench/batch-3.tar.gz
          compression-level: 0
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: bench-tasks-4
          path: ${{ runner.temp }}/bench/batch-4.tar.gz
          compression-level: 0
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: bench-tasks-5
          path: ${{ runner.temp }}/bench/batch-5.tar.gz
          compression-level: 0
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: bench-tasks-6
          path: ${{ runner.temp }}/bench/batch-6.tar.gz
          compression-level: 0
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: bench-tasks-7
          path: ${{ runner.temp }}/bench/batch-7.tar.gz
          compression-level: 0
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: bench-tasks-8
          path: ${{ runner.temp }}/bench/batch-8.tar.gz
          compression-level: 0
          if-no-files-found: error
  model_0:
    needs: [prepare]
    if: ${{ always() && !cancelled() && needs.prepare.result == 'success' }}
    uses: ./.github/workflows/bench-model.yml
    with:
      model: 0
  model_1:
    needs: [prepare, model_0]
    if: ${{ always() && !cancelled() && needs.prepare.result == 'success' }}
    uses: ./.github/workflows/bench-model.yml
    with:
      model: 1
  model_2:
    needs: [prepare, model_1]
    if: ${{ always() && !cancelled() && needs.prepare.result == 'success' }}
    uses: ./.github/workflows/bench-model.yml
    with:
      model: 2
  model_3:
    needs: [prepare, model_2]
    if: ${{ always() && !cancelled() && needs.prepare.result == 'success' }}
    uses: ./.github/workflows/bench-model.yml
    with:
      model: 3
  model_4:
    needs: [prepare, model_3]
    if: ${{ always() && !cancelled() && needs.prepare.result == 'success' }}
    uses: ./.github/workflows/bench-model.yml
    with:
      model: 4
  model_5:
    needs: [prepare, model_4]
    if: ${{ always() && !cancelled() && needs.prepare.result == 'success' }}
    uses: ./.github/workflows/bench-model.yml
    with:
      model: 5
  collect:
    needs: [prepare, model_0, model_1, model_2, model_3, model_4, model_5]
    if: ${{ always() && !cancelled() && needs.prepare.result == 'success' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.8.22'
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: bench-manifest
          path: ${{ runner.temp }}/manifest
      - uses: actions/download-artifact@v4
        with:
          pattern: bench-receipt-*
          path: ${{ runner.temp }}/receipts
      - name: Validate coverage and export public summary
        run: |
          uv run --no-project --with harbor==0.24.0 --with litellm==1.103.4 python -m scripts.bench.collect \
            --manifest "$RUNNER_TEMP/manifest/manifest.json" \
            --receipts "$RUNNER_TEMP/receipts" --public \
            --output "$RUNNER_TEMP/public/index.json"
      - name: Archive complete or incomplete summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bench-public-summary
          path: ${{ runner.temp }}/public/index.json
          if-no-files-found: error

  publish:
    needs: collect
    permissions:
      contents: write
    concurrency:
      group: evaluation-history
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.8.22'
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: bench-public-summary
          path: summary
      - name: Append validated immutable public history
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          gh auth setup-git
          store="$RUNNER_TEMP/evaluation-history"
          git init "$store"
          git -C "$store" remote add origin "https://github.com/$REPOSITORY.git"
          if git -C "$store" ls-remote --exit-code origin refs/heads/bench-results; then
            git -C "$store" fetch --depth=1 origin bench-results
            git -C "$store" checkout -b bench-results FETCH_HEAD
          else
            status=$?
            if [ "$status" != 2 ]; then exit "$status"; fi
            git -C "$store" checkout --orphan bench-results
          fi
          uv run --no-project --with pyyaml==6.0.2 python -m scripts.bench.history \
            --summary summary/index.json --index "$store/public/index.json" \
            --workflow-url "$RUN_URL"
          git -C "$store" config user.name 'github-actions[bot]'
          git -C "$store" config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git -C "$store" add public/index.json
          if ! git -C "$store" diff --cached --quiet; then
            git -C "$store" commit -m 'Archive public evaluation results'
            git -C "$store" push origin HEAD:bench-results
          fi

  website:
    needs: publish
    permissions:
      contents: write
    uses: ./.github/workflows/deploy-website.yml
    with:
      ref: ${{ github.repository == 'agentscope-ai/QwenPaw' && github.event.repository.default_branch || github.sha }}
      dry_run: ${{ github.repository != 'agentscope-ai/QwenPaw' }}
    secrets: inherit
