name: Integration Nightly

# Nightly full sweep of the integration suite (all markers).
#
# tests.yml runs the PR (p0) and pre-merge (p0+p1) tiers; this workflow
# fills in the missing tier by running every @pytest.mark.integration case,
# including p2 and any future "longer / less critical" ones.
#
# Independent of tests.yml so it can run unattended without going through
# the manual maintainer-approval gate that protects PR/push CI.

on:
  schedule:
    # 18:17 UTC daily ~= 02:17 Beijing the next day.
    # Off-the-hour to avoid the global GitHub Actions cron rush at :00 / :30.
    - cron: '17 18 * * *'
  workflow_dispatch:

jobs:
  integration-nightly:
    name: Integration Nightly - py${{ matrix.python-version }} - ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13"]
        os: [ubuntu-latest]
        include:
          - os: macos-latest
            python-version: "3.10"
          - os: windows-latest
            python-version: "3.10"

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js (for console build)
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: console/package-lock.json

      - name: Build console frontend
        shell: bash
        env:
          NODE_OPTIONS: "--max-old-space-size=8192"
        run: |
          cd console && npm ci && npm run build

      - name: Copy console build into package
        shell: bash
        run: |
          rm -rf src/qwenpaw/console/*
          mkdir -p src/qwenpaw/console
          cp -R console/dist/* src/qwenpaw/console/

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,full]"

      - name: Run integration suite (full sweep)
        shell: bash
        run: |
          pytest tests/integration -v -m integration
