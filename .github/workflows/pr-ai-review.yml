name: AI Code Review

on:
  pull_request_target:
    types: [opened, synchronize]

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  # Maintainer must approve before AI review runs
  review-gate:
    name: AI Review Approval
    runs-on: ubuntu-latest
    environment: ai-review-approved
    steps:
      - run: echo "Maintainer approved AI review for PR #${{ github.event.pull_request.number }}"

  ai-review:
    name: QwenPaw AI Review
    needs: review-gate
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      DASHSCOPE_API_KEY: ${{ secrets.REVIEW_DASHSCOPE_API_KEY }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
      PR_TITLE: ${{ github.event.pull_request.title }}
      PR_AUTHOR: ${{ github.event.pull_request.user.login }}
      PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}
      PR_BASE_REF: ${{ github.event.pull_request.base.ref }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: console/package-lock.json

      - name: Build console frontend
        env:
          NODE_OPTIONS: "--max-old-space-size=8192"
        run: cd console && npm ci && npm run build

      - name: Copy frontend build into package
        run: |
          rm -rf src/qwenpaw/console/*
          mkdir -p src/qwenpaw/console
          cp -R console/dist/* src/qwenpaw/console/

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install QwenPaw and dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pip install httpx

      - name: Initialize QwenPaw workspace
        run: |
          qwenpaw init --defaults --accept-security
          python scripts/review-bot/setup_review_workspace.py

      - name: Start QwenPaw server
        run: |
          QWENPAW_AUTH_ENABLED=false \
          python -m qwenpaw app --host 127.0.0.1 --port 8088 &
          echo $! > /tmp/qwenpaw.pid

      - name: Wait for QwenPaw to be ready
        run: |
          for i in $(seq 1 90); do
            if curl -sf http://localhost:8088/api/version > /dev/null 2>&1; then
              echo "QwenPaw is ready (took ${i}s)"
              exit 0
            fi
            sleep 1
          done
          echo "QwenPaw failed to start within 90 seconds"
          exit 1

      - name: Fetch PR diff
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const prNumber = context.payload.pull_request.number;

            const { data: pr } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: prNumber,
            });

            const { data: files } = await github.rest.pulls.listFiles({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: prNumber,
              per_page: 100,
            });

            let diff = '';
            let size = 0;
            const MAX_SIZE = 60000;

            for (const f of files) {
              if (size > MAX_SIZE) {
                diff += '\n... (diff truncated at 60KB)\n';
                break;
              }
              const entry = `### ${f.filename} (${f.status}, +${f.additions}/-${f.deletions})\n\`\`\`diff\n${f.patch || '(binary file)'}\n\`\`\`\n\n`;
              diff += entry;
              size += entry.length;
            }

            fs.writeFileSync('/tmp/pr_diff.txt', diff);
            fs.writeFileSync('/tmp/pr_meta.json', JSON.stringify({
              number: prNumber,
              title: pr.title,
              body: (pr.body || '').slice(0, 3000),
              author: pr.user.login,
              base: pr.base.ref,
              head: pr.head.ref,
              file_count: files.length,
              additions: files.reduce((s, f) => s + f.additions, 0),
              deletions: files.reduce((s, f) => s + f.deletions, 0),
              changed_files: files.map(f => f.filename),
            }));

      - name: Run AI Review
        id: review
        run: python scripts/review-bot/review_runner.py

      - name: Post review comment
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const prNumber = context.payload.pull_request.number;
            const verdict = '${{ steps.review.outputs.verdict }}';
            const reviewBody = fs.readFileSync('/tmp/review_result.md', 'utf8');

            const icon = verdict === 'APPROVE' ? '✅' : '⚠️';
            const title = verdict === 'APPROVE' ? '通过' : '建议修改';
            const header = `## ${icon} QwenPaw AI Review: ${title}\n\n`;
            const footer = '\n\n---\n' +
              `*🤖 由 QwenPaw Review Bot 自动生成 | ` +
              `PR #${prNumber} | ` +
              `Triggered by maintainer approval*`;

            const marker = '<!-- qwenpaw-ai-review -->';
            const fullBody = `${marker}\n${header}${reviewBody}${footer}`;

            const comments = await github.paginate(
              github.rest.issues.listComments,
              {
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber,
              }
            );
            const existing = comments.find(c => c.body && c.body.includes(marker));

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body: fullBody,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber,
                body: fullBody,
              });
            }

            if (verdict === 'APPROVE') {
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber,
                labels: ['ready_for_merge'],
              });
            } else {
              try {
                await github.rest.issues.removeLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: prNumber,
                  name: 'ready_for_merge',
                });
              } catch (e) {}
            }

      - name: Stop QwenPaw
        if: always()
        run: |
          if [ -f /tmp/qwenpaw.pid ]; then
            kill $(cat /tmp/qwenpaw.pid) 2>/dev/null || true
          fi
