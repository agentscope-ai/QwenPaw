name: Tauri Checks

on:
  pull_request:
    branches: [main, master, dev, develop]
    paths:
      - 'console/src-tauri/**'
      - 'scripts/pack-tauri/**'
      - '.github/workflows/tauri-check.yml'
  push:
    branches: [main, master, dev, develop]
    paths:
      - 'console/src-tauri/**'
      - 'scripts/pack-tauri/**'
      - '.github/workflows/tauri-check.yml'

jobs:
  spam-gate:
    name: PR Spam Gate
    if: github.event_name == 'pull_request'
    uses: ./.github/workflows/pr-spam-gate.yml
    with:
      author: ${{ github.event.pull_request.user.login }}

  cargo-check:
    name: cargo check (${{ matrix.os }})
    needs: [spam-gate]
    if: |
      always() &&
      (needs.spam-gate.result == 'skipped' || needs.spam-gate.outputs.blocked != 'true')
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    defaults:
      run:
        working-directory: console/src-tauri

    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: console/src-tauri

      - name: Run cargo check
        run: cargo check --locked
