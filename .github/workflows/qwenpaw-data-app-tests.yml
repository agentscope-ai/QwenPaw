name: QwenPaw Data App Tests

on:
  push:
    branches: [main, master, dev, develop, "dev/**"]
    paths:
      - "plugins/apps/qwenpaw-data/ui/**"
      - "plugins/apps/qwenpaw-data/backend/**"
      - "tests/unit/pawapp/test_qwenpaw_data*.py"
      - "src/qwenpaw/pawapp/service.py"
      - ".github/workflows/qwenpaw-data-app-tests.yml"
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [main, master, dev, develop, "dev/**"]
    paths:
      - "plugins/apps/qwenpaw-data/ui/**"
      - "plugins/apps/qwenpaw-data/backend/**"
      - "tests/unit/pawapp/test_qwenpaw_data*.py"
      - "src/qwenpaw/pawapp/service.py"
      - ".github/workflows/qwenpaw-data-app-tests.yml"

jobs:
  spam-gate:
    name: PR Spam Gate
    if: github.event_name == 'pull_request'
    uses: ./.github/workflows/pr-spam-gate.yml
    with:
      author: ${{ github.event.pull_request.user.login }}

  runtime-tests:
    name: QwenPaw Data Runtime - ${{ matrix.os }}
    needs: [spam-gate]
    if: |
      always() &&
      (needs.spam-gate.result == 'skipped' || needs.spam-gate.outputs.blocked != 'true') &&
      (github.event_name != 'pull_request' || github.event.pull_request.draft == false)
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install runtime test dependencies
        run: python -m pip install -e ".[test]"
      - name: Check model errors and managed service lifecycle
        run: >-
          python -m pytest -q
          tests/unit/pawapp/test_qwenpaw_data_model_settings.py
          tests/unit/pawapp/test_qwenpaw_data_standalone.py
          tests/unit/pawapp/test_qwenpaw_data_service_lifecycle.py

  ui-tests:
    name: QwenPaw Data UI Build & Tests
    needs: [spam-gate]
    if: |
      always() &&
      (needs.spam-gate.result == 'skipped' || needs.spam-gate.outputs.blocked != 'true') &&
      (github.event_name != 'pull_request' || github.event.pull_request.draft == false)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: plugins/apps/qwenpaw-data/ui
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: plugins/apps/qwenpaw-data/ui/package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Type check
        run: npm run typecheck

      - name: Run unit tests
        run: npm test

      - name: Build plugin frontend
        run: npm run build
