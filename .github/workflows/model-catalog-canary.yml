name: Model catalog canary

on:
  # Run only from Actions > Run workflow; no push or scheduled probes.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: model-catalog-canary
  cancel-in-progress: false

jobs:
  canary:
    # Repository variable (not a secret): MODEL_CANARY_ENABLED must be "true".
    # Manual runs are restricted to the default branch below.
    if: >-
      vars.MODEL_CANARY_ENABLED == 'true' &&
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install httpx==0.28.1
      - name: Check catalogs and pinned free models
        # GitHub supplies GITHUB_RUN_NUMBER to rotate the pinned model order,
        # and GITHUB_STEP_SUMMARY as the output path for the run summary.
        # Configure API keys under Settings > Secrets and variables > Actions.
        # A missing key skips that provider's generation probe.
        env:
          # OpenRouter API key for the pinned free-model request.
          MODEL_CANARY_OPENROUTER_API_KEY: ${{ secrets.MODEL_CANARY_OPENROUTER_API_KEY }}
          # OpenCode Zen API key for the pinned free-model request.
          MODEL_CANARY_OPENCODE_API_KEY: ${{ secrets.MODEL_CANARY_OPENCODE_API_KEY }}
          # Kilo Gateway API key for the pinned free-model request.
          MODEL_CANARY_KILO_API_KEY: ${{ secrets.MODEL_CANARY_KILO_API_KEY }}
        run: >-
          python scripts/model_catalog/canary.py --generate
          --output canary-results/catalog.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: model-catalog-canary
          path: canary-results/catalog.json
          retention-days: 14
