name: Tests

on:
  push:
    branches: [main, master, dev, develop]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'scripts/check-channels.sh'
      - 'scripts/check_channel_contracts.py'
      - '.gitattributes'
      - 'pyproject.toml'
      - 'setup.py'
      - 'deploy/Dockerfile'
      - '.github/workflows/tests.yml'
  pull_request:
    # Default types plus ready_for_review: converting a draft PR to
    # ready must re-trigger this workflow so the real tiers run on the
    # current head right after the author leaves draft state.
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [main, master, dev, develop]
  workflow_dispatch:
    inputs:
      integration_marker:
        description: >-
          Pytest marker expression for the integration tier. Leave blank
          to run the FULL integration suite (the default for every event).
          Fill in to narrow a manual run, e.g. "integration and p0",
          "integration and (p0 or p1)".
        required: false
        default: ''

# Phase-1 simplification (plan v1.6 item 1-4): the PR gate no longer
# collects coverage. Coverage data, the combined report and the backend
# unit threshold (pyproject fail_under) all live in full-tests-nightly.yml,
# which keeps its own Coverage Report job unchanged.

jobs:
  spam-gate:
    name: PR Spam Gate
    if: github.event_name == 'pull_request'
    uses: ./.github/workflows/pr-spam-gate.yml
    with:
      author: ${{ github.event.pull_request.user.login }}

  # Replaces the former `on.pull_request.paths` filter: the workflow now runs
  # (and reports a status) on every PR so `Test Summary` can be a required
  # check, but docs-only PRs skip the approval gate and every test tier.
  changes:
    name: Detect code changes
    runs-on: ubuntu-latest
    outputs:
      code: ${{ github.event_name != 'pull_request' && 'true' || steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@v4
        if: github.event_name == 'pull_request'
      - uses: dorny/paths-filter@v3
        if: github.event_name == 'pull_request'
        id: filter
        with:
          filters: |
            code:
              - 'src/**'
              - 'tests/**'
              - 'scripts/check-channels.sh'
              - 'scripts/check_channel_contracts.py'
              - '.gitattributes'
              - 'pyproject.toml'
              - 'setup.py'
              - '.github/workflows/tests.yml'

  approval-gate:
    name: Maintainer Approval
    needs: [spam-gate, changes]
    if: |
      always() &&
      needs.changes.outputs.code == 'true' &&
      (needs.spam-gate.result == 'skipped' || needs.spam-gate.outputs.blocked != 'true') &&
      (github.event_name != 'pull_request' || github.event.pull_request.draft == false)
    runs-on: ubuntu-latest
    environment: maintainer-approved
    steps:
      - name: Approval granted
        run: echo "Approved by maintainer"

  unit-tests:
    name: Unit Tests - py${{ matrix.python-version }} - ${{ matrix.os }}
    needs: approval-gate
    if: |
      always() &&
      needs.approval-gate.result == 'success'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
        os: [ubuntu-latest]
        # Phase-1 simplification (CI simplification plan v1.6, item 1-1):
        # PR gate runs ubuntu only. Cross-platform compatibility is covered by
        # the nightly full matrix (full-tests-nightly.yml), which keeps all
        # four OS entries. Measured: windows unit 25.4 min and windows p1
        # integration 39.6 min were the two slowest jobs of the whole PR gate
        # (run 34194545575), while windows p0 (28.1 min) is slower than ubuntu
        # p1 (25.5 min) — so dropping platforms saves more wall clock than
        # dropping priorities would.

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux isolation dependency
        if: |
          runner.os == 'Linux' &&
          matrix.python-version == '3.11'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap
          if sysctl kernel.apparmor_restrict_unprivileged_userns \
            >/dev/null 2>&1; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi

      # Phase-1 simplification (plan v1.6, item 1-2): console frontend build
      # removed from the three backend tiers. Verified: tests/unit,
      # tests/contract and tests/integration contain no reference to built
      # frontend assets; the only web-root probe (test_app_startup.py) asserts
      # BOTH branches (200-with-HTML or 404-with-fallback-JSON), and the Hub
      # local-runtime E2E only hits API routes. Behavioral evidence: the
      # fork-local pr-preview workflow ran all three tiers without any console
      # build and passed. The E2E tier keeps its own build (_e2e-job.yml).

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,test,full]"

      - name: Run unit tests
        shell: bash
        run: |
          # Phase-1 simplification (plan v1.6, item 1-4): coverage tracking
          # removed from the PR gate. Coverage is collected and threshold-
          # gated in the nightly full run (full-tests-nightly.yml), per the
          # 9-09 decision; the implicit fail_under (pyproject.toml) applies
          # there, so no threshold is lowered by this removal.
          pytest tests/unit -v

      - name: Run Hub Local runtime E2E
        if: matrix.python-version == '3.11'
        shell: bash
        env:
          QWENPAW_LOCAL_RUNTIME_E2E: '1'
        run: |
          python -m pip install --no-deps --force-reinstall .
          pytest tests/e2e/test_hub_local_runtime.py -v

  contract-tests:
    name: Contract Tests - py${{ matrix.python-version }} - ${{ matrix.os }}
    needs: approval-gate
    if: |
      always() &&
      needs.approval-gate.result == 'success'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
        os: [ubuntu-latest]
        # Phase-1 simplification (CI simplification plan v1.6, item 1-1):
        # PR gate runs ubuntu only. Cross-platform compatibility is covered by
        # the nightly full matrix (full-tests-nightly.yml), which keeps all
        # four OS entries. Measured: windows unit 25.4 min and windows p1
        # integration 39.6 min were the two slowest jobs of the whole PR gate
        # (run 34194545575), while windows p0 (28.1 min) is slower than ubuntu
        # p1 (25.5 min) — so dropping platforms saves more wall clock than
        # dropping priorities would.

    steps:
      - uses: actions/checkout@v4

      # Phase-1 simplification (plan v1.6, item 1-2): console frontend build
      # removed from the three backend tiers. Verified: tests/unit,
      # tests/contract and tests/integration contain no reference to built
      # frontend assets; the only web-root probe (test_app_startup.py) asserts
      # BOTH branches (200-with-HTML or 404-with-fallback-JSON), and the Hub
      # local-runtime E2E only hits API routes. Behavioral evidence: the
      # fork-local pr-preview workflow ran all three tiers without any console
      # build and passed. The E2E tier keeps its own build (_e2e-job.yml).

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,test,full]"

      - name: Check channel contract coverage
        run: python scripts/check_channel_contracts.py

      - name: Validate channel check script
        shell: bash
        run: bash -n scripts/check-channels.sh

      - name: Run contract tests
        shell: bash
        run: |
          # Phase-1 simplification (plan v1.6, item 1-4): coverage removed
          # from the PR gate (it carried an explicit fail-under of 0 here, so
          # removing it lowers no threshold). Nightly keeps contract coverage.
          pytest tests/contract -v

  integrated-tests:
    name: Integrated Tests - py${{ matrix.python-version }} - ${{ matrix.os }} - ${{ matrix.shard }}
    # Phase-1 simplification (plan v1.6, item 1-7): run in parallel with the
    # unit tier instead of waiting for it. The original sequencing avoided
    # burning integration runners when unit was red; measured over the last
    # 30 tests.yml runs, unit was red in 0 of the 15 runs that executed it,
    # so the protection rarely paid off. Fail-closed is preserved: test-summary
    # still needs unit-tests, so a red unit tier blocks the merge regardless
    # of integration results. Concurrency peak drops (ubuntu-only matrix),
    # staying far below the org limit of 60.
    needs: [approval-gate]
    if: |
      always() &&
      needs.approval-gate.result == 'success'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Phase-1 item (plan v1.7, maintainer-approved 9-09): the integration
        # tier runs Python 3.11 only in the PR gate. Measured over the last 40
        # runs (tests.yml + full-tests-nightly.yml), the ubuntu 3.11 vs 3.13
        # integration verdicts diverged exactly once (2026-08-20 nightly), and
        # that divergence was NOT version-specific: the same case
        # (test_matrix_mock.py::test_matrix_dm_disabled_drops_message) also
        # failed on windows 3.11 in the same run — a cross-platform flake.
        # The other 39 runs agreed across versions, so the second Python
        # version of the integration tier captured nothing in three months.
        # Python-version compatibility stays gated by the unit tier here
        # (3.11 + 3.13, cheap and parallel) and by the nightly full matrix.
        # Wall clock is unchanged: shards run in parallel and the slowest
        # (ubuntu 3.11 p1, 25.5 min) still dominates.
        python-version: ["3.11"]
        os: [ubuntu-latest]
        shard: [p0, p1, p2]
        # Phase-1 simplification (plan v1.6): ubuntu-only matrix (item 1-1) and
        # fallback shard removed (item 1-3). The unclassified-test alarm now
        # runs inside the ubuntu/py3.11/p0 job (see the "Fail on unclassified
        # integration tests" step), which already has a full environment, so
        # no separate fallback job pays environment setup for an 11-second
        # collect-only check. Cross-platform coverage stays in nightly.

    steps:
      - uses: actions/checkout@v4

      # Phase-1 simplification (plan v1.6, item 1-2): console frontend build
      # removed from the three backend tiers. Verified: tests/unit,
      # tests/contract and tests/integration contain no reference to built
      # frontend assets; the only web-root probe (test_app_startup.py) asserts
      # BOTH branches (200-with-HTML or 404-with-fallback-JSON), and the Hub
      # local-runtime E2E only hits API routes. Behavioral evidence: the
      # fork-local pr-preview workflow ran all three tiers without any console
      # build and passed. The E2E tier keeps its own build (_e2e-job.yml).

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          # The macOS runner ships setuptools 65.5.0, which pip's resolver
          # upgrades to the latest release (84.x) while backtracking the
          # dependency graph. setuptools >= 82 no longer ships
          # pkg_resources.declare_namespace, which lark-oapi's namespace
          # packages still call at import time, so the Feishu mock IM
          # integration tests crash with AttributeError on macOS. Pin
          # setuptools <82 here — the pin must ride in the SAME pip command
          # as the install: a separate `pip install "setuptools<82"` step
          # beforehand gets upgraded away by this resolution again
          # (reproduced with pip 26.2.1; see CI run 31571533395).
          if [ "${{ runner.os }}" = "macOS" ]; then
            pip install -e ".[dev,test,full]" "setuptools<82"
          else
            pip install -e ".[dev,test,full]"
          fi

      # tests/integration/browser carries the integration marker but no
      # priority marker, so any expression without a p0/p1 filter (a
      # workflow_dispatch of "integration", say) selects it and needs a real
      # Chromium. Same command as the e2e workflows.
      - name: Install Playwright browser
        shell: bash
        run: |
          playwright install chromium --with-deps

      - name: Check if integrated tests exist
        id: check-integrated
        shell: bash
        run: |
          if [ -d "tests/integration" ] && compgen -G "tests/integration/*.py" > /dev/null; then
            echo "has_tests=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_tests=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create console dist placeholder
        shell: bash
        run: |
          # The SPA catch-all route is registered only when the console
          # static directory exists (src/qwenpaw/app/_app.py resolves it and
          # gates `if os.path.isdir(...)`). Production wheels always ship it,
          # so API routing tests expect the "with build" behaviour: GET on a
          # missing /api resource is answered 404 by the catch-all. Without
          # any console build the catch-all is absent and the same request
          # matches DELETE /{plugin_id} with a wrong method -> 405.
          # An EMPTY directory reproduces the production routing without
          # paying a frontend build: no index.html means the web root still
          # takes the fallback branch and /assets stays unmounted.
          mkdir -p console/dist

      - name: Determine pytest marker expression
        id: marker
        if: steps.check-integrated.outputs.has_tests == 'true'
        shell: bash
        env:
          DISPATCH_MARKER: ${{ inputs.integration_marker }}
        run: |
          # Manual dispatch override -> use whatever the maintainer typed.
          # Everything else (PR gate / push) -> split by shard (p0/p1/p2).
          # The PR gate is the only layer that reliably runs (post-merge
          # push runs wait on the maintainer-approved environment), so
          # problems are blocked here rather than detected after merge.
          if [ -n "${DISPATCH_MARKER}" ]; then
            EXPR="${DISPATCH_MARKER}"
          else
            # Split by shard for parallel execution. Unclassified integration
            # tests (lacking a p0/p1/p2 marker) are caught by the dedicated
            # "Fail on unclassified integration tests" guard, which runs on
            # the ubuntu/py3.11/p0 entry, so they can never be silently
            # skipped.
            case "${{ matrix.shard }}" in
              p0) EXPR="integration and p0" ;;
              p1) EXPR="integration and p1" ;;
              p2) EXPR="integration and p2" ;;
            esac
          fi
          echo "expr=$EXPR" >> "$GITHUB_OUTPUT"
          echo "Selected marker expression: $EXPR"

      - name: Fail on unclassified integration tests
        if: |
          steps.check-integrated.outputs.has_tests == 'true' &&
          matrix.shard == 'p0' &&
          matrix.os == 'ubuntu-latest' &&
          matrix.python-version == '3.11'
        shell: bash
        run: |
          # Guard: every integration test must carry a priority marker.
          # If the fallback shard collects anything, a new unclassified
          # test slipped in -- fail loudly instead of silently running
          # it outside the three priority shards.
          UNCLASSIFIED=$(python -m pytest tests/integration --collect-only -q \
            -m "integration and not (p0 or p1 or p2)" 2>/dev/null \
            | grep -c "::" || true)
          if [ "${UNCLASSIFIED}" -gt 0 ]; then
            echo "::error::${UNCLASSIFIED} integration test(s) lack a p0/p1/p2 priority marker. Assign one so the test joins a priority shard."
            python -m pytest tests/integration --collect-only -q \
              -m "integration and not (p0 or p1 or p2)" 2>/dev/null | grep "::" || true
            exit 1
          fi
          echo "No unclassified integration tests."

      - name: Run integrated tests
        if: steps.check-integrated.outputs.has_tests == 'true'
        shell: bash
        env:
          # Windows/macOS runners are slower and IO-bound; under xdist
          # parallel the default HTTP timeouts are too tight and
          # intermittently surface as ``httpx.ReadTimeout`` (e.g. the real
          # plugin install on macOS). Lift the floor on non-Linux runners.
          QWENPAW_INTEGRATION_HTTP_TIMEOUT: ${{ matrix.os != 'ubuntu-latest' && '120' || '' }}
        run: |
          # Phase-1 simplification (plan v1.6, item 1-4): subprocess coverage
          # removed from the PR gate; nightly keeps integration coverage via
          # its own dispatch (coverage_platforms input).
          PYTEST_RC=0
          pytest tests/integration -v \
            -n auto --dist=loadscope --timeout=300 \
            -m "${{ steps.marker.outputs.expr }}" || PYTEST_RC=$?
          # exit 5 = no tests collected. With the fallback shard removed
          # (item 1-3) every shard selects a non-empty priority set, so 5 is
          # tolerated only as a defensive guard, not an expected path.
          if [ "$PYTEST_RC" -ne 0 ] && [ "$PYTEST_RC" -ne 5 ]; then
            exit "$PYTEST_RC"
          fi

  test-summary:
    name: Test Summary
    needs: [changes, approval-gate, unit-tests, contract-tests, integrated-tests]
    # Fail-closed gate. This job ALWAYS runs (no path condition) so the
    # required-check context can never be satisfied by an accidental skip.
    # Four-state decision:
    #   1. change detection did not succeed -> red (its `code` output is
    #      unreliable when the detection job fails/is cancelled, so the
    #      gate must close rather than open);
    #   2. detection succeeded and reported a docs-only PR -> explicit
    #      green (instead of skipping, which a ruleset cannot distinguish
    #      from a bypass);
    #   3. draft PR with code changes -> explicit green placeholder: the
    #      real tiers are deferred while the PR is a draft (GitHub forbids
    #      merging drafts, so the placeholder cannot smuggle anything in),
    #      and the `ready_for_review` trigger re-runs the whole workflow
    #      the moment the author marks the PR ready;
    #   4. code change -> approval plus EVERY test tier must be strictly
    #      `success`; failure/cancelled/skipped are all rejected.
    # Coverage is no longer part of the PR gate (plan v1.6 item 1-4); it is
    # collected and threshold-gated in the nightly full run.
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check test results
        shell: bash
        run: |
          echo "Changes detection: ${{ needs.changes.result }}"
          echo "Approval gate: ${{ needs.approval-gate.result }}"
          echo "Unit tests: ${{ needs.unit-tests.result }}"
          echo "Contract tests: ${{ needs.contract-tests.result }}"
          echo "Integrated tests: ${{ needs.integrated-tests.result }}"
          # Phase-1 item 1-4: the PR gate no longer runs a coverage-report
          # job; coverage is collected and threshold-gated in the nightly
          # full run instead.

          if [ "${{ needs.changes.result }}" != "success" ]; then
            echo "❌ Change detection did not succeed (${{ needs.changes.result }}) — gate closed, refusing untested merge"
            exit 1
          fi

          if [ "${{ needs.changes.outputs.code }}" != "true" ]; then
            echo "✅ Docs-only change — no test tiers required"
            exit 0
          fi

          if [ "${{ github.event_name }}" = "pull_request" ] && \
             [ "${{ github.event.pull_request.draft }}" = "true" ]; then
            echo "✅ Draft PR — test tiers deferred until the PR is marked ready for review"
            exit 0
          fi

          if [ "${{ needs.approval-gate.result }}" != "success" ]; then
            echo "❌ Approval not granted"
            exit 1
          fi

          if [ "${{ needs.unit-tests.result }}" != "success" ] || \
             [ "${{ needs.contract-tests.result }}" != "success" ] || \
             [ "${{ needs.integrated-tests.result }}" != "success" ]; then
            echo "❌ Every test tier must be success (failure/cancelled/skipped are all rejected)"
            exit 1
          fi

          echo "✅ All tests passed"
