name: Evaluation checks
on:
  pull_request:
    paths:
      - '.github/bench/**'
      - '.github/workflows/bench*.yml'
      - '.github/workflows/deploy-website.yml'
      - 'scripts/bench/**'
      - 'tests/unit/scripts/bench/**'
      - 'website/**'
  push:
    branches: [feat/bench, main]
    paths:
      - '.github/bench/**'
      - '.github/workflows/bench*.yml'
      - '.github/workflows/deploy-website.yml'
      - 'scripts/bench/**'
      - 'tests/unit/scripts/bench/**'
      - 'website/**'
permissions:
  contents: read
jobs:
  contracts:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.8.22'
          python-version: '3.12'
      - name: Scoring, cost and publication contracts
        run: >-
          uv run --no-project --with harbor==0.24.0 --with litellm==1.103.4
          --with pytest python -m pytest -c /dev/null
          --confcutdir=tests/unit/scripts/bench -p no:cacheprovider
          tests/unit/scripts/bench -q
  website:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: website/pnpm-lock.yaml
      - run: pnpm --dir website install --frozen-lockfile
      - run: pnpm --dir website test:evaluation
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.8.22'
          python-version: '3.12'
      - name: Validate result JSON and generate website index
        env:
          VISIBILITY: ${{ github.event.repository.private && 'private' || 'public' }}
        run: >-
          uv run --no-project --with pyyaml==6.0.2 python -m scripts.bench.results
          --build-index --data website/public/evaluation/data --visibility "$VISIBILITY"
      - run: pnpm --dir website build
      - uses: actions/upload-artifact@v4
        with:
          name: evaluation-website-preview
          path: website/dist
          retention-days: 14
