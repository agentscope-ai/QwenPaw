name: One isolated task attempt
on:
  workflow_call:
    inputs:
      experiment:
        required: true
        type: string
      model:
        required: true
        type: number
      batch:
        required: true
        type: number
      task:
        required: true
        type: string
      job_minutes:
        required: true
        type: number
      attempt:
        required: true
        type: number
permissions:
  contents: read
jobs:
  task:
    environment: Bench
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ inputs.job_minutes }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.8.22'
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: bench-manifest-${{ inputs.experiment }}
          path: ${{ runner.temp }}/manifest
      - uses: actions/download-artifact@v4
        with:
          name: bench-tasks-${{ inputs.experiment }}-${{ inputs.batch }}
          path: ${{ runner.temp }}/batches
      - name: Resolve provider secret reference
        id: provider
        env:
          MANIFEST_PATH: ${{ runner.temp }}/manifest/manifest.json
        run: |
          python - <<'PYCODE'
          import json, os
          from pathlib import Path
          data = json.loads(Path(os.environ['MANIFEST_PATH']).read_text())
          name = data['models']['provider']['secret_name']
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('secret_name=' + name + '\n')
          PYCODE
      - name: Unpack frozen batch
        env:
          BATCH: ${{ inputs.batch }}
        run: |
          python - <<'PYCODE'
          import os, tarfile
          from pathlib import Path
          root = Path(os.environ['RUNNER_TEMP'])
          with tarfile.open(root / 'batches' / ('batch-' + os.environ['BATCH'] + '.tar.gz')) as archive:
              archive.extractall(root / 'datasets', filter='data')
          PYCODE
      - name: Run one task-trial via Harbor ACP
        env:
          BENCH_API_KEY: ${{ secrets[steps.provider.outputs.secret_name] }}
          TASK_ID: ${{ inputs.task }}
          MODEL_INDEX: ${{ inputs.model }}
          ATTEMPT: ${{ inputs.attempt }}
        run: |
          uv run --no-project --with harbor==0.24.0 --with litellm==1.103.4 python -m scripts.bench.run \
            --manifest "$RUNNER_TEMP/manifest/manifest.json" \
            --datasets "$RUNNER_TEMP/datasets" --task "$TASK_ID" \
            --model "$MODEL_INDEX" --attempt "$ATTEMPT" --output "$RUNNER_TEMP/result"
      - name: Preserve credential-redacted trajectory
        id: trace
        if: ${{ always() && !cancelled() }}
        env:
          BENCH_API_KEY: ${{ secrets[steps.provider.outputs.secret_name] }}
        run: |
          if [ -d "$RUNNER_TEMP/result" ]; then
            cp "$RUNNER_TEMP/manifest/manifest.json" "$RUNNER_TEMP/result/manifest.json"
            uv run --no-project --with pyyaml==6.0.2 python -m scripts.bench.trace \
              --input "$RUNNER_TEMP/result" --output "$RUNNER_TEMP/public-trace"
          fi
      - uses: actions/upload-artifact@v4
        if: ${{ always() && !cancelled() && steps.trace.outcome == 'success' }}
        with:
          name: bench-trace-${{ inputs.experiment }}-${{ inputs.model }}-${{ inputs.task }}-${{ inputs.attempt }}
          path: ${{ runner.temp }}/public-trace
          retention-days: 90
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bench-receipt-${{ inputs.experiment }}-${{ inputs.model }}-${{ inputs.task }}-${{ inputs.attempt }}
          path: ${{ runner.temp }}/result/receipt.json
          if-no-files-found: warn
