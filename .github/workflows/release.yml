# QwenPaw unified release orchestrator (draft-driven, all-or-nothing).
#
# Flow (方案二 · 草稿变体):
#   1. A maintainer creates a DRAFT GitHub Release (tag + notes), does NOT publish.
#   2. They run this workflow (Actions ▸ Run workflow). It resolves the draft,
#      pins every job to the draft's target commit, then builds + verifies ALL
#      products in parallel (wheel / web verify / desktop win+mac / plugins).
#   3. Only if EVERY prepare job is green does the publish phase run: PyPI,
#      Docker, desktop (GitHub assets + OSS), plugins. The draft is flipped to
#      published LAST. Post-publish (inline): promote the desktop latest/updater,
#      deploy the website (stable/post only — skipped for betas), and open the
#      Release Duty issue.
#   4. If anything fails, nothing is published and the draft is left untouched
#      (zero external trace; just fix and re-run).
#
# Merge freeze: from the moment this workflow starts until it ends (success,
# failure, cancellation or a re-run of failed jobs), a red "Release Window"
# commit status is posted on every open PR targeting the default branch.
# With "Release Window" listed among the required status checks of the branch
# ruleset, no PR can be merged into the default branch while a release is in
# flight. UNFREEZING deliberately does NOT happen in this workflow:
# release-window-watchdog.yml is the sole unfreezer — it waits until NO
# release run is queued/in-progress (which also covers concurrent releases
# with different tags, and "Re-run failed jobs" windows that never re-run
# freeze-main), then deletes the lock marker and re-stamps every PR green.
# The label description records this run's id so the watchdog can verify the
# recorded run completed before unlocking.
#
# dry_run=true stubs the three production-external publishes (PyPI / Docker /
# OSS) so fork CI can exercise the gating + draft flip without touching prod.
# Draft-asset upload, the draft→published flip and the duty issue still run for
# real because on a fork they only affect the fork's own resources.

name: Release (unified)

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Draft release tag to publish (empty = auto-detect the single draft)"
        required: false
        type: string
        default: ""
      dry_run:
        description: "Stub production publishes (PyPI/Docker/OSS) — use on forks"
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  issues: write
  # Needed by the freeze-main job below, which posts commit statuses
  # ("Release Window") on the head commit of every open PR targeting the
  # default branch while a release is in flight.
  statuses: write

concurrency:
  group: release-${{ inputs.tag || github.ref }}
  cancel-in-progress: false

jobs:
  # ── Merge freeze: block PR merges into the default branch while releasing ──
  # Posts a red "Release Window" commit status on the head commit of every
  # open non-draft PR targeting the default branch, and creates the
  # "release-window-active" label as a lock marker. When a repository ruleset
  # lists "Release Window" among its required status checks, no PR can be
  # merged: existing PRs carry the red status, and PRs opened later carry no
  # status at all, which a required check treats as "not reported" (blocked).
  # Unfreezing is the sole responsibility of release-window-watchdog.yml,
  # which waits until no release run remains in flight (see header comment).
  # Commit statuses are repository-local, so this also runs on dry_run
  # (forks only affect forks).
  freeze-main:
    runs-on: ubuntu-latest
    # GitHub-hosted jobs default to a 6-hour timeout. If `gh api` hangs instead
    # of failing (half-dead network, stalled TLS), this job would sit there with
    # the lock marker raised and every PR stamped red — freezing the default
    # branch for 6 hours, and the watchdog would correctly refuse to unlock
    # (the recorded release run is still "in progress"). Timing out turns that
    # into a job failure, which skips resolve and closes the release: the
    # fail-closed property is unchanged, the blast radius is not.
    # Freezing ~285 PRs takes well under a minute in practice.
    timeout-minutes: 10
    steps:
      - name: Freeze merges into the default branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          default="$(gh api "repos/$REPO" --jq '.default_branch')"
          echo "Freezing merges into '$default' for release run $RUN_URL"

          api_post_status() {
            # api_post_status <sha> <state> <description> <target_url>
            # A failed red stamp here fails the whole release, so retry on
            # primary/secondary rate limits (HTTP 403/429) with exponential
            # backoff; any other error fails immediately.
            local sha="$1" state="$2" desc="$3" url="$4"
            local attempt=1 delay=2 err
            while true; do
              err="$(gh api --method POST "repos/$REPO/statuses/$sha" \
                -f state="$state" \
                -f context="Release Window" \
                -f description="$desc" \
                -f target_url="$url" 2>&1 >/dev/null)" && return 0
              case "$err" in
                *"HTTP 403"*|*"HTTP 429"*|*"rate limit"*|*"abuse"*) rate_limited=1 ;;
                *) rate_limited=0 ;;
              esac
              if [ "$rate_limited" = "1" ]; then
                if [ "$attempt" -ge 4 ]; then
                  echo "::error::Giving up on status for $sha after $attempt attempts: $err"
                  return 1
                fi
                echo "Rate-limited writing status for $sha; retry $attempt in ${delay}s."
                sleep "$delay"
                delay=$((delay * 2))
                attempt=$((attempt + 1))
              else
                echo "::error::Failed writing status for $sha: $err"
                return 1
              fi
            done
          }

          fetch_pr_list() {
            # fetch_pr_list <base-branch>
            # Prints "<pr> <head-sha>" per line for every open NON-DRAFT PR
            # targeting <base-branch>; prints nothing when there are none.
            #
            # This MUST be a command substitution at the call site, never a
            # process substitution (`< <(...)`) feeding the loop directly: a
            # process substitution runs in its own process whose exit status
            # is invisible to `set -e` and `pipefail`, so a failed list fetch
            # would run the loop zero times, leave failures=0, and let this job
            # report SUCCESS while not a single PR got frozen — a silent hole
            # in the release window (fail-open). Command substitution propagates
            # the failure, so the job dies and resolve is blocked (fail-closed).
            #
            # Retries ANY failure, not just rate limits — deliberately wider
            # than api_post_status below. Listing is fatal by design, so even a
            # transient 404 or a stalled TLS handshake deserves a retry: a
            # single blip must not abort a whole release. Observed for real
            # during review — the first `--paginate` call returned HTTP 404 and
            # the same command then succeeded three times in a row.
            local base="$1" attempt=1 delay=2 rc out
            while true; do
              rc=0
              out="$(gh api --paginate "repos/$REPO/pulls?state=open&base=$base&per_page=100" \
                --jq '.[] | select(.draft != true) | "\(.number) \(.head.sha)"' 2>/dev/null)" || rc=$?
              if [ "$rc" -eq 0 ]; then
                # Emit nothing for an empty result: a stray blank line would
                # give the caller's `while read` one iteration with empty pr/sha.
                if [ -n "$out" ]; then
                  printf '%s\n' "$out"
                fi
                return 0
              fi
              if [ "$attempt" -ge 4 ]; then
                echo "::error::Giving up listing open PRs after $attempt attempts (gh api exit $rc on pulls?state=open&base=$base). Freezing nothing is not an option — aborting." >&2
                return 1
              fi
              echo "Listing open PRs failed (gh api exit $rc); retry $attempt in ${delay}s." >&2
              sleep "$delay"
              delay=$((delay * 2))
              attempt=$((attempt + 1))
            done
          }

          # Lock marker: lets the sentinel and the watchdog tell "frozen" from
          # "not frozen" with a single cheap request. Idempotent. The
          # description records THIS run's id so the watchdog can verify the
          # recorded run completed before unlocking (guards against a new
          # release starting during watchdog cleanup).
          label_desc="Release in flight — merges into the default branch are frozen (run ${{ github.run_id }})"
          if gh api "repos/$REPO/labels/release-window-active" >/dev/null 2>&1; then
            gh api --method PATCH "repos/$REPO/labels/release-window-active" \
              -f description="$label_desc" >/dev/null
          else
            gh api --method POST "repos/$REPO/labels" \
              -f name="release-window-active" \
              -f color="B60205" \
              -f description="$label_desc" >/dev/null
          fi
          echo "Lock marker present."

          # Page through ALL open non-draft PRs targeting the default branch
          # (never a fixed limit: a PR missed by the freeze would silently keep
          # a merge hole open for the whole release window). Drafts cannot be
          # merged by GitHub in the first place.
          #
          # Command substitution, NOT process substitution — see fetch_pr_list.
          # If listing fails, this job fails and the release is blocked.
          pr_list="$(fetch_pr_list "$default")"
          frozen=0
          failures=0
          if [ -n "$pr_list" ]; then
            while read -r pr sha; do
              if api_post_status "$sha" "failure" "Release in progress — merges frozen" "$RUN_URL"; then
                echo "Froze PR #$pr ($sha)"
                frozen=$((frozen + 1))
              else
                failures=$((failures + 1))
              fi
              sleep 0.25
            done <<< "$pr_list"
          else
            echo "No open non-draft PRs target '$default' — nothing to freeze."
          fi
          if [ "$failures" -gt 0 ]; then
            echo "::error::$failures PR(s) could not be frozen — aborting the release (fail closed)."
            exit 1
          fi
          echo "Freeze applied: $frozen PR(s) stamped red."

  # ── Resolve the draft, pin the commit, fail fast on missing secrets ─────────
  # Fail-closed: resolve waits on freeze-main. If the merge freeze cannot be
  # applied, the release must not proceed — releasing without the freeze would
  # silently re-open exactly the window this workflow exists to close.
  resolve:
    needs: [freeze-main]
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.pick.outputs.tag }}
      sha: ${{ steps.pick.outputs.sha }}
      is_prerelease: ${{ steps.pick.outputs.is_prerelease }}
    steps:
      - name: Resolve target draft release and commit
        id: pick
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          TAG="$INPUT_TAG"
          if [ -z "$TAG" ]; then
            drafts="$(gh release list --repo "$REPO" --limit 100 \
              --json tagName,isDraft --jq '[.[] | select(.isDraft) | .tagName]')"
            count="$(echo "$drafts" | jq 'length')"
            if [ "$count" -eq 0 ]; then
              echo "::error::No draft release found. Create a draft first or pass an explicit tag."
              exit 1
            fi
            if [ "$count" -gt 1 ]; then
              echo "::error::Multiple draft releases found: $(echo "$drafts" | jq -r 'join(", ")'). Pass an explicit tag to disambiguate."
              exit 1
            fi
            TAG="$(echo "$drafts" | jq -r '.[0]')"
          fi
          echo "Target tag: $TAG"
          isDraft="$(gh release view "$TAG" --repo "$REPO" --json isDraft --jq '.isDraft')"
          if [ "$isDraft" != "true" ]; then
            echo "::error::Release $TAG is not a draft; refusing to operate on a published release."
            exit 1
          fi
          target="$(gh release view "$TAG" --repo "$REPO" --json targetCommitish --jq '.targetCommitish')"
          sha="$(gh api "repos/$REPO/commits/$target" --jq '.sha')"
          echo "Target commitish '$target' resolved to SHA $sha"
          if [[ "$TAG" =~ (beta|alpha|rc|dev) ]]; then
            is_prerelease=true
          else
            is_prerelease=false
          fi
          echo "Prerelease (tag-based): $is_prerelease"
          {
            echo "tag=$TAG"
            echo "sha=$sha"
            echo "is_prerelease=$is_prerelease"
          } >> "$GITHUB_OUTPUT"

      - name: Checkout the resolved commit
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.pick.outputs.sha }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Validate tag matches src/qwenpaw/__version__.py
        run: |
          python -m pip install --quiet packaging
          ver="$(sed -n 's/^__version__[[:space:]]*=[[:space:]]*"\([^"]*\)".*/\1/p' src/qwenpaw/__version__.py)"
          tag="${{ steps.pick.outputs.tag }}"
          python - "${tag#v}" "$ver" <<'PY'
          import sys
          from packaging.version import InvalidVersion, Version

          tag_ver, ver = sys.argv[1], sys.argv[2]
          try:
              if Version(tag_ver) != Version(ver):
                  print(
                      f"::error::Draft tag '{tag_ver}' does not match "
                      f"src/qwenpaw/__version__.py '{ver}'. "
                      f"Fix the tag or bump the version before releasing."
                  )
                  sys.exit(1)
          except InvalidVersion as exc:
              print(f"::error::Cannot parse versions for comparison ({exc}).")
              sys.exit(1)
          print(f"OK: tag normalizes to __version__ ({ver}).")
          PY

      - name: Ensure release secrets present (skip on dry_run)
        env:
          QWENPAW_DASHSCOPE_API_KEY: ${{ secrets.QWENPAW_DASHSCOPE_API_KEY }}
        run: |
          if [ "${{ inputs.dry_run }}" != "true" ] && [ -z "${QWENPAW_DASHSCOPE_API_KEY:-}" ]; then
            echo "::error::QWENPAW_DASHSCOPE_API_KEY is not set; desktop verification cannot validate the LLM chat round."
            exit 1
          fi
          echo "Secret check OK (dry_run=${{ inputs.dry_run }})"

  # ── Prepare phase: build + verify everything, publish nothing ──────────────
  build-wheel:
    needs: [resolve]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.sha }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Node (for console build)
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: console/package-lock.json

      - name: Build console frontend
        run: |
          cd console && npm ci && npm run build

      - name: Copy console build into package
        run: |
          rm -rf src/qwenpaw/console/*
          mkdir -p src/qwenpaw/console
          cp -R console/dist/* src/qwenpaw/console/

      - name: Bundle docs into package
        run: |
          rm -rf src/qwenpaw/docs
          mkdir -p src/qwenpaw/docs
          cp website/public/docs/*.md src/qwenpaw/docs/

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install setuptools wheel build

      - name: Build package
        run: python -m build

      - name: Upload dist artifacts
        uses: actions/upload-artifact@v4
        with:
          name: qwenpaw-dist
          path: dist/
          retention-days: 7

      - name: Upload version metadata
        uses: actions/upload-artifact@v4
        with:
          name: qwenpaw-version
          path: src/qwenpaw/__version__.py
          retention-days: 7

  verify-web:
    needs: [resolve, build-wheel]
    uses: ./.github/workflows/release-verify.yml
    with:
      verify_pip: true
      verify_docker: true
      verify_script_install: true
      ref: ${{ needs.resolve.outputs.sha }}
      # On dry_run (fork) the private ACR base images are unreachable, so fall
      # back to public images for the Docker health-check build.
      docker_node_image: ${{ inputs.dry_run && 'node:20-slim' || '' }}
      docker_uv_image: ${{ inputs.dry_run && 'ghcr.io/astral-sh/uv:latest' || '' }}
    secrets: inherit

  build-desktop:
    needs: [resolve]
    uses: ./.github/workflows/desktop-build.yml
    with:
      ref: ${{ needs.resolve.outputs.sha }}
    secrets: inherit

  build-plugins:
    needs: [resolve]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.sha }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Pack plugins and build index
        # qwenpaw-creator and qwenpaw-data are released through their own
        # version-driven pipelines (creator-release.yml,
        # qwenpaw-data-release.yml pending); qwenpaw-data additionally needs its
        # vendored context console staged before packing, so packing it
        # here fails pack_requires validation by design.
        run: |
          python scripts/pack/generate_plugin_metadata.py \
            --plugins-root plugins \
            --dist dist/plugins \
            --metadata-out dist/plugins/index.json \
            --cdn-prefix /files/plugins \
            --exclude qwenpaw-creator \
            --exclude qwenpaw-data

      - name: Upload plugins dist
        uses: actions/upload-artifact@v4
        with:
          name: qwenpaw-plugins-dist
          path: dist/plugins
          retention-days: 7

  build-docker:
    needs: [resolve]
    runs-on: ubuntu-latest
    env:
      ACR_REGISTRY: agentscope-registry.ap-southeast-1.cr.aliyuncs.com
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.sha }}
          submodules: recursive

      - name: Get QwenPaw version
        id: version
        uses: ./.github/actions/get-version

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Aliyun ACR
        if: ${{ !inputs.dry_run }}
        uses: docker/login-action@v3
        with:
          registry: ${{ env.ACR_REGISTRY }}
          username: ${{ secrets.ALIYUN_ACR_USERNAME }}
          password: ${{ secrets.ALIYUN_ACR_PASSWORD }}

      - name: Build multi-arch image
        env:
          DOCKER_NODE_IMAGE: ${{ inputs.dry_run && 'node:20-slim' || '' }}
          DOCKER_UV_IMAGE: ${{ inputs.dry_run && 'ghcr.io/astral-sh/uv:latest' || '' }}
          QWENPAW_DISABLED_CHANNELS: "imessage"
          QWENPAW_VERSION: ${{ steps.version.outputs.version }}
        run: |
          BUILD_ARGS=()
          if [ -n "${DOCKER_NODE_IMAGE}" ]; then
            BUILD_ARGS+=(--build-arg "NODE_IMAGE=${DOCKER_NODE_IMAGE}")
          fi
          if [ -n "${DOCKER_UV_IMAGE}" ]; then
            BUILD_ARGS+=(--build-arg "UV_IMAGE=${DOCKER_UV_IMAGE}")
          fi
          docker buildx build --platform linux/amd64,linux/arm64 \
            -f deploy/Dockerfile \
            --build-arg QWENPAW_DISABLED_CHANNELS="${QWENPAW_DISABLED_CHANNELS}" \
            --build-arg \
            QWENPAW_MANAGED_RUNTIME_BOUNDARY_VERSION="${QWENPAW_VERSION}" \
            --output "type=oci,dest=${RUNNER_TEMP}/qwenpaw-image.tar" \
            "${BUILD_ARGS[@]}" .

      - name: Upload multi-arch OCI image
        uses: actions/upload-artifact@v4
        with:
          name: qwenpaw-docker-image
          path: ${{ runner.temp }}/qwenpaw-image.tar
          compression-level: 0
          retention-days: 7

  # ── Gate: publish jobs below run only if every prepare job above is green ──

  publish-pypi:
    needs: [resolve, build-wheel, verify-web, build-desktop, build-plugins, build-docker]
    runs-on: ubuntu-latest
    steps:
      - name: Download dist artifacts
        uses: actions/download-artifact@v4
        with:
          name: qwenpaw-dist
          path: dist

      - name: Publish package to PyPI
        if: ${{ !inputs.dry_run }}
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          user: __token__
          password: ${{ secrets.PYPI_API_TOKEN }}

      - name: Dry-run notice
        if: ${{ inputs.dry_run }}
        run: |
          echo "DRY-RUN: would publish $(ls dist) to PyPI"

  push-docker:
    needs: [resolve, build-wheel, verify-web, build-desktop, build-plugins, build-docker]
    runs-on: ubuntu-latest
    env:
      ACR_REGISTRY: agentscope-registry.ap-southeast-1.cr.aliyuncs.com
      IMAGE: agentscope/qwenpaw
    steps:
      - name: Download multi-arch OCI image
        uses: actions/download-artifact@v4
        with:
          name: qwenpaw-docker-image
          path: ${{ runner.temp }}/qwenpaw-docker-image

      - name: Install Skopeo
        run: |
          sudo apt-get update
          sudo apt-get install -y skopeo

      - name: Validate multi-arch OCI image
        run: |
          SOURCE="oci-archive:${RUNNER_TEMP}/qwenpaw-docker-image/qwenpaw-image.tar"
          MANIFEST="$(skopeo inspect --raw "${SOURCE}")"
          PLATFORMS="$(jq -r '
            .manifests[]?.platform
            | select(.os != null and .architecture != null)
            | "\(.os)/\(.architecture)"
          ' <<< "${MANIFEST}")"
          echo "Platforms in OCI image:"
          echo "${PLATFORMS}"
          for REQUIRED_PLATFORM in linux/amd64 linux/arm64; do
            if ! grep -Fxq "${REQUIRED_PLATFORM}" <<< "${PLATFORMS}"; then
              echo "::error::OCI image is missing ${REQUIRED_PLATFORM}"
              exit 1
            fi
          done

      - name: Log in to DockerHub
        if: ${{ !inputs.dry_run }}
        uses: docker/login-action@v3
        with:
          registry: docker.io
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Log in to Aliyun ACR
        if: ${{ !inputs.dry_run }}
        uses: docker/login-action@v3
        with:
          registry: ${{ env.ACR_REGISTRY }}
          username: ${{ secrets.ALIYUN_ACR_USERNAME }}
          password: ${{ secrets.ALIYUN_ACR_PASSWORD }}

      - name: Push multi-arch image (version + pre [+ latest])
        if: ${{ !inputs.dry_run }}
        env:
          VERSION: ${{ needs.resolve.outputs.tag }}
        run: |
          IS_PRERELEASE="${{ needs.resolve.outputs.is_prerelease }}"
          DESTINATIONS=(
            "${ACR_REGISTRY}/${IMAGE}:${VERSION}"
            "${ACR_REGISTRY}/${IMAGE}:pre"
            "docker.io/${IMAGE}:${VERSION}"
            "docker.io/${IMAGE}:pre"
          )
          if [ "${IS_PRERELEASE}" != "true" ]; then
            DESTINATIONS+=(
              "${ACR_REGISTRY}/${IMAGE}:latest"
              "docker.io/${IMAGE}:latest"
            )
          fi
          SOURCE="oci-archive:${RUNNER_TEMP}/qwenpaw-docker-image/qwenpaw-image.tar"
          AUTH_FILE="${HOME}/.docker/config.json"
          for DESTINATION in "${DESTINATIONS[@]}"; do
            skopeo copy --all --authfile "${AUTH_FILE}" \
              "${SOURCE}" "docker://${DESTINATION}"
          done

      - name: Dry-run notice
        if: ${{ inputs.dry_run }}
        run: |
          echo "DRY-RUN: would push the prebuilt Docker image for ${{ needs.resolve.outputs.tag }}"

  publish-desktop:
    needs: [resolve, build-wheel, verify-web, build-desktop, build-plugins, build-docker]
    uses: ./.github/workflows/desktop-publish.yml
    with:
      tag: ${{ needs.resolve.outputs.tag }}
      ref: ${{ needs.resolve.outputs.sha }}
      dry_run: ${{ inputs.dry_run }}
    secrets: inherit

  publish-plugins:
    needs: [resolve, build-wheel, verify-web, build-desktop, build-plugins, build-docker]
    runs-on: ubuntu-latest
    env:
      OSS_BUCKET: ${{ vars.OSS_BUCKET || 'qwenpaw-download' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.sha }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Download plugins dist
        uses: actions/download-artifact@v4
        with:
          name: qwenpaw-plugins-dist
          path: dist/plugins

      - name: Dry-run notice
        if: ${{ inputs.dry_run }}
        run: |
          echo "DRY-RUN: would sync $(find dist/plugins -name '*.zip' | wc -l) plugin zips + index to OSS"

      - name: Install ossutil
        if: ${{ !inputs.dry_run }}
        run: |
          wget -q https://gosspublic.alicdn.com/ossutil/1.7.18/ossutil-v1.7.18-linux-amd64.zip
          unzip -q ossutil-v1.7.18-linux-amd64.zip
          chmod +x ossutil-v1.7.18-linux-amd64/ossutil64
          sudo mv ossutil-v1.7.18-linux-amd64/ossutil64 /usr/local/bin/ossutil
          ossutil --version

      - name: Configure ossutil
        if: ${{ !inputs.dry_run }}
        run: |
          ossutil config -e ${{ secrets.OSS_ENDPOINT }} \
            -i ${{ secrets.OSS_ACCESS_KEY_ID }} \
            -k ${{ secrets.OSS_ACCESS_KEY_SECRET }} \
            -L CH

      - name: Sync plugin zips to OSS (long-cache, immutable)
        if: ${{ !inputs.dry_run }}
        run: |
          shopt -s nullglob
          for kind in bundle tool apps; do
            while IFS= read -r -d '' f; do
              rel="${f#dist/plugins/}"
              echo "Uploading $f -> files/plugins/${rel}"
              ossutil cp "$f" \
                "oss://${OSS_BUCKET}/files/plugins/${rel}" \
                --acl public-read \
                --force \
                --meta "Cache-Control:public, max-age=31536000, immutable"
            done < <(find "dist/plugins/${kind}" -type f -name '*.zip' -print0 2>/dev/null || true)
          done

      - name: Merge historical versions into index
        if: ${{ !inputs.dry_run }}
        run: |
          ossutil cp "oss://${OSS_BUCKET}/metadata/plugins/index.json" \
            existing-index.json 2>/dev/null || echo '{}' > existing-index.json
          python3 scripts/pack/merge_plugin_index.py \
            --new dist/plugins/index.json \
            --old existing-index.json \
            --out dist/plugins/index.json \
            --retire-plugin-id computer-use-tool

      - name: Upload plugins index (short-cache)
        if: ${{ !inputs.dry_run }}
        run: |
          ossutil cp dist/plugins/index.json \
            "oss://${OSS_BUCKET}/metadata/plugins/index.json" \
            --acl public-read \
            --force \
            --meta "Cache-Control:public, max-age=60, must-revalidate"

      - name: Patch main metadata index to advertise plugins product
        if: ${{ !inputs.dry_run }}
        run: |
          ossutil cp "oss://${OSS_BUCKET}/metadata/index.json" \
            main-index.json 2>/dev/null || cat > main-index.json << 'EOF'
          {
            "version": "1.0",
            "updated_at": "",
            "products": {}
          }
          EOF
          python3 scripts/pack/patch_main_index.py \
            --index main-index.json \
            --out   main-index.json
          ossutil cp main-index.json \
            "oss://${OSS_BUCKET}/metadata/index.json" \
            --acl public-read \
            --force \
            --meta "Cache-Control:public, max-age=60, must-revalidate"

  # ── Finalize: flip the draft to published LAST (pinned to the built SHA) ────
  finalize:
    needs: [resolve, publish-pypi, push-docker, publish-desktop, publish-plugins]
    runs-on: ubuntu-latest
    steps:
      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          TAG: ${{ needs.resolve.outputs.tag }}
          SHA: ${{ needs.resolve.outputs.sha }}
        run: |
          echo "Flipping draft $TAG -> published, pinned to $SHA"
          gh release edit "$TAG" --repo "$REPO" --draft=false --target "$SHA"

  # ── Post-publish: promote desktop latest + updater manifest + index ─────────
  # Runs only after the release is published, so the auto-updater is pointed at
  # the new version only once the release actually exists.
  promote-desktop:
    needs: [resolve, finalize]
    uses: ./.github/workflows/desktop-promote.yml
    with:
      tag: ${{ needs.resolve.outputs.tag }}
      ref: ${{ needs.resolve.outputs.sha }}
      dry_run: ${{ inputs.dry_run }}
    secrets: inherit

  # ── Post-publish: create the Release Duty verification issue (inline) ───────
  duty-issue:
    needs: [resolve, finalize]
    uses: ./.github/workflows/release-duty.yml
    with:
      tag: ${{ needs.resolve.outputs.tag }}
    secrets: inherit

  # ── Post-publish: deploy the public website (stable + post only) ────────────
  # Skipped for pre-releases (beta/alpha/rc/dev) so the site advertises only
  # GA/post versions. Invoked inline because the finalize job flips the draft
  # with GITHUB_TOKEN, which suppresses deploy-website.yml's own release trigger.
  deploy-website:
    needs: [resolve, finalize]
    if: needs.resolve.outputs.is_prerelease == 'false'
    uses: ./.github/workflows/deploy-website.yml
    with:
      ref: ${{ needs.resolve.outputs.sha }}
      dry_run: ${{ inputs.dry_run }}
    secrets: inherit

  # ── Merge unfreeze is NOT done here ─────────────────────────────────────────
  # release-window-watchdog.yml is the sole unfreezer: it deletes the lock
  # marker and re-stamps every open PR green only once NO release run is
  # queued/in-progress anywhere in the repo. This removes the race surface of
  # having two unfreezers, and correctly covers concurrent releases (different
  # tags) and "Re-run failed jobs" windows (freeze-main is not re-run there,
  # but the re-run keeps the run queued/in_progress). The label's description
  # records this run's id, which the watchdog verifies completed. Residual
  # cost: merges are re-opened minutes after release completion rather than
  # seconds — an accepted trade-off at the release-end boundary.
