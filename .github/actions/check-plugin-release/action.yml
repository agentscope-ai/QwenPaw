name: Check immutable plugin releases
description: Verify plugin versions and atomically reserve or publish their content.
inputs:
  artifacts-root:
    default: dist
    description: Built plugin ZIPs or QwenPaw wheels
  project-root:
    default: ""
    description: Optional source tree for channels included in a host release
  publish:
    default: "false"
    description: Publish immutable plugin ZIPs after verifying all identities
  dry-run:
    default: "false"
    description: Validate without reserving or publishing objects
runs:
  using: composite
  steps:
    - uses: actions/setup-python@v5
      with:
        python-version: "3.11"
    - name: Install CI-only release dependencies
      shell: bash
      run: python -m pip install 'pip>=26.2.2' 'certifi>=2026.10.19' packaging 'oss2>=2.19.1,<3'
    - name: Check and reserve immutable content
      shell: bash
      env:
        ARTIFACTS_ROOT: ${{ inputs.artifacts-root }}
        PROJECT_ROOT: ${{ inputs.project-root }}
        PUBLISH_PLUGINS: ${{ inputs.publish }}
        RELEASE_DRY_RUN: ${{ inputs.dry-run }}
      run: |
        set -euo pipefail
        args=(release --artifacts-root "$ARTIFACTS_ROOT")
        if [[ -n "$PROJECT_ROOT" ]]; then args+=(--project-root "$PROJECT_ROOT"); fi
        if [[ "$PUBLISH_PLUGINS" == true ]]; then args+=(--publish); fi
        if [[ "$RELEASE_DRY_RUN" == true ]]; then args+=(--dry-run); fi
        python "$GITHUB_ACTION_PATH/../../../scripts/pack/check_plugin_versions.py" "${args[@]}"
